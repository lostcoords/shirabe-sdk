  /api/v1/oauth/token:
    post:
      operationId: oauthToken
      summary: Obtain or renew tokens (the OAuth 2.0 token endpoint)
      description: |
        The token endpoint (RFC 6749 §3.2), for every way a connected app gets its
        credentials. Four grants:

        - `authorization_code`: the redirect flow. Redeem the one-time `code`
          from the `/oauth/authorize` redirect with the PKCE `code_verifier`.
        - `refresh_token`: renewal. Trade the refresh token from the last pair for
          the next one. Refresh tokens are **single-use and rotate**: store the
          new pair before using it, renew single-flight, and treat
          `invalid_grant` as "the link is over, reconnect". Presenting a refresh
          token that was already traded (outside a short retry grace) revokes the
          whole grant.
        - `client_credentials`: backend-to-backend access with no user. A
          confidential client authenticates with HTTP Basic and receives a
          short-lived token carrying only its registered machine scopes. It never
          receives a refresh token.
        - `urn:ietf:params:oauth:grant-type:device_code`: the device flow (RFC
          8628). Poll with the `device_code` from `/oauth/device_authorization`
          every `interval` seconds until the user approves; `authorization_pending`
          means keep polling.

        A confidential client (registered with a secret) authenticates on every
        call: `client_secret` in the body, or HTTP Basic with the client id and
        secret. A public client sends only `client_id`. Accepts JSON or
        `application/x-www-form-urlencoded`. No bearer: this is how you get one.

        Access tokens live thirty days and are sent as `Authorization: Bearer`.
        Refresh tokens live ninety days from their last use.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
      responses:
        '200':
          description: A fresh access token, and a refresh token for user-delegated grants.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponse'
        '400':
          $ref: '#/components/responses/OauthError'
        '401':
          $ref: '#/components/responses/OauthInvalidClient'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/oauth/revoke:
    post:
      operationId: oauthRevoke
      summary: Revoke a grant (RFC 7009)
      description: |
        Hand back a token the app holds, of either kind, and the whole grant behind
        it is over: the user's approval, its access tokens and its refresh tokens.
        Disconnecting inside an app should call this, or the approval stays on the
        user's access list until it idles out.

        Answers `200` whatever it found (RFC 7009 §2.2): an unknown or already
        revoked token is a revocation with nothing left to do. A token that belongs
        to another client is left alone.

        Client authentication as for the token endpoint. No bearer.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthRevokeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthRevokeRequest'
      responses:
        '200':
          description: Revoked, or nothing to revoke.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OauthInvalidClient'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      summary: Start the device flow (RFC 8628)
      description: |
        For a registered client that cannot receive a redirect: a CLI, a console,
        a TV. Returns a `user_code` to show the user and a `verification_uri` (or
        `verification_uri_complete`, with the code filled in) for them to open and
        approve. The client then polls the token endpoint with
        `grant_type=urn:ietf:params:oauth:grant-type:device_code` every `interval`
        seconds until the user has approved.

        `scope` is space-separated and is narrowed to what the client registered
        for; omitting it asks for the default read set. Client authentication as
        for the token endpoint. No bearer.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthDeviceAuthorizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthDeviceAuthorizationRequest'
      responses:
        '200':
          description: The handshake was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthDeviceAuthorization'
        '400':
          $ref: '#/components/responses/OauthError'
        '401':
          $ref: '#/components/responses/OauthInvalidClient'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/search:
    post:
      operationId: search
      summary: Search
      description: |
        Searches the caller's dictionary stack using the same tokenizer, ranking,
        filters, and dictionary preferences as the website's
        dictionary search. For example, Sudachi tokenization lets 食べている find
        食べる by its lemma.

        The response contains Shirabe's preferred segmentation of the query. Every
        segment contains its ranked word-card matches; every match merges word,
        name, and encyclopedia entries by canonical form. Use `include` to add kanji
        details or example sentences to each match. The website's sentence, grammar,
        and people search pages are not part of this operation.

        Put `#key:value` filters in `query`, send them in `filters`, or use both.
        The two sets are merged. `limit` caps the ranked matches in each segment.
        Each match's `id` can be passed to `GET /api/v1/words/{id}`.

        This read uses POST because it accepts a structured JSON body and depends on
        the API key owner's preferences, so it is not edge-cacheable.
      tags:
        - Search
      security:
        - BearerAuth:
            - user:dictionary:read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/identify:
    post:
      operationId: identifyWord
      summary: Identify a word
      description: |
        Finds dictionary expressions beginning at one UTF-16 position in surrounding
        text. This is the popup counterpart to search: it uses the caller's active
        dictionary stack and returns overlapping spans rather than one segmentation
        of the complete text.

        `target.endOffset` is an optional boundary hint from the caller. A matching span is
        ranked first, but Shirabe still returns other dictionary-bearing spans that
        begin at `target.startOffset`. No caller tokenization or dictionary override is
        accepted. This operation does not apply contextual JEV sense ranking.
      tags:
        - Search
      security:
        - BearerAuth:
            - user:dictionary:read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequest'
      responses:
        '200':
          description: Ranked dictionary spans beginning at the requested position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Text exceeds this user's per-request limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error413'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/parse:
    post:
      operationId: parse
      summary: Parse Japanese text
      description: |
        Returns one preferred segmentation for every item in `texts`. Shirabe uses
        the caller's active dictionary stack, including private dictionaries, when
        choosing useful word boundaries. It does not return alternative parses or
        definitions. Resolve a selected span from the local dictionary pack or use
        `POST /api/v1/identify` with the surrounding text and token offsets.

        A bearer token is optional for synchronous parsing. Without one, Shirabe
        uses the public dictionary stack, accepts up to 2,000 characters per
        request, and applies an IP-based request limit. A bearer token enables the
        caller's dictionary stack and its configured limits. The `study` include
        requires its own scope.

        Offsets are UTF-16 and map directly to browser text nodes.
        Authenticated callers may add `Prefer: respond-async` to queue the same operation and poll the URL in the
        `Location` header. The request and completed result shapes are identical in
        synchronous and asynchronous use. Anonymous requests remain synchronous.
        `results` follows the same order as
        `texts`, and each result repeats its submitted text.
      tags:
        - Search
      security:
        - {}
        - BearerAuth:
            - dictionary:read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum:
              - respond-async
          description: Queue an authenticated parse when set to `respond-async`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: One preferred parse for each submitted text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parse'
        '202':
          description: The parse was queued. Poll the `Location` URL.
          headers:
            Location:
              required: true
              schema:
                type: string
            Preference-Applied:
              required: true
              schema:
                type: string
                const: respond-async
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Text exceeds the caller's per-request limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error413'
              example:
                type: https://shirabe.org/docs/errors/text-too-large
                title: Text too large
                status: 413
                detail: This user allows 10000 characters per tokenization request.
                code: TEXT_TOO_LARGE
                instance: req-7f3a9b2c
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/parse/{id}:
    get:
      operationId: getParseOperation
      summary: Get a queued parse
      description: Poll the parse operation URL returned by `POST /api/v1/parse`.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current operation state, including the parse when complete.
          headers:
            Retry-After:
              description: Seconds to wait before polling again. Present only while the operation is queued or running.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/saves:
    post:
      operationId: saveCard
      summary: Save a word as an SRS card
      description: |
        Creates an SRS review card for a word in the API key owner's deck, the
        `/api/v1` twin of saving from the website. Identity is (deck, front, reading),
        so re-saving a word you already have is idempotent. `rating` is accepted
        only for an existing card whose scheduled review is currently due; early,
        repeated, and save-plus-first-grade submissions are rejected. Subject to
        the plan's saved-card limit.
      tags:
        - Cards
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: Word already saved; the existing card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '201':
          description: A new card was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: unsaveWord
      summary: Remove a word from the owner's reviews
      description: |
        Trashes every card the word holds, a word can carry a card per meaning, and
        removing them one id at a time is N requests that can half-finish, or race a
        save landing in between.

        Recoverable, like `DELETE /api/v1/srs/cards/{id}` and the bulk `delete` action:
        the cards go to the trash and a scheduled sweep purges them later.
      tags:
        - Cards
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - lemma
              properties:
                lemma:
                  type: string
                  description: Dictionary form (card front).
                  example: 今日
                reading:
                  type: string
                  description: The card's reading; omit for a card saved without one.
                  example: キョウ
      responses:
        '200':
          description: |
            The word after removal, `state` is `none` once its last card is gone. Removing a word with no cards is not an error; the answer simply says so.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - word
                properties:
                  word:
                    $ref: '#/components/schemas/WordStateEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/reviews:
    post:
      operationId: gradeCard
      summary: Grade an SRS card
      description: |
        Submits a review grade (1=Again, 2=Hard, 3=Good, 4=Easy) for one of the
        API key owner's cards, advancing its FSRS schedule. Include sessionId to
        grade the next card of an API session and record its Undo identity. Without
        sessionId, this is a standalone dictionary or reader review.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: The graded card with its new schedule, plus the next interval previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The card changed after it was displayed. Read it again before grading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/sessions:
    post:
      operationId: startStudySession
      summary: Start an ordered study session
      description: |
        Starts the owner's API study session, replacing any previous API session
        without ending a browser session. A session expires at the next study-day
        boundary. Pass its sessionId with reviews and Undo requests.
        Omit deckId to study all eligible decks; selecting a linked Anki parent
        includes its linked descendants. Cards follow captured Anki display settings
        and daily limits. Fetch this session after each grade to receive the next card.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deckId:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: The new session and its next card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The study session has ended or expired. Start a new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getStudySession
      summary: Read an ordered study session
      description: |
        Returns the next eligible card, counts and Undo identity. Previously
        gathered Anki cards retain their relative order after grading. Changes from
        another client, deck settings or card edits can rebuild the queue.
        Grade the returned card using its current revision and this sessionId.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:read
      responses:
        '200':
          description: The current session queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The study session has ended or expired. Start a new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: endStudySession
      summary: End an API study session
      description: Ends the session without undoing reviews or affecting a browser session. Repeating the request is harmless.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:write
      responses:
        '204':
          description: The session has ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/reviews/latest:
    delete:
      operationId: undoLatestReview
      summary: Undo the most recent review
      description: |
        With sessionId, undoes the specified review only if it is the session's
        latest review and the session has not expired or ended. Without sessionId,
        the review must be a standalone review and the owner's latest in the current
        study day. A review sent to Anki requires the Anki review-undo resources.
        Restores its prior
        card schedule and removes that review. Retain reviewId from each grade
        response to walk back earlier grades in order. A stale or repeated request
        never undoes a different review.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoReviewRequest'
      responses:
        '200':
          description: The restored card with its reverted schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The specified review is no longer undoable. No other review was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/states:
    post:
      operationId: setWordState
      summary: Set a word's learning state
      description: |
        Sets a word's state for the API key owner. `retired` parks it as learned
        (out of review, still counted toward knowledge); `reviewing` brings it into
        the SRS rotation. Find-or-creates the word's card, state IS the card, there
        is no separate word-state record. Retiring is ungated; `reviewing` a
        brand-new word is subject to the plan's saved-card limit.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateRequest'
      responses:
        '200':
          description: The word after the change, every card it holds moved to that state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - word
                properties:
                  word:
                    $ref: '#/components/schemas/WordStateEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/states/lookup:
    post:
      operationId: lookupWordStates
      summary: Batch-read word states
      description: |
        Returns the API key owner's learning state for each requested word in one
        round-trip, for re-colouring a page (e.g. a subtitle cue changing) without
        re-parsing.
      tags:
        - Review
      security:
        - BearerAuth:
            - user:study:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateLookupRequest'
      responses:
        '200':
          description: Per-word state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/decks:
    get:
      operationId: listDecks
      summary: List the owner's decks
      description: |
        The API key owner's decks with per-deck card counts, for rendering a deck
        picker or discovering a `deckId` to pass to the save endpoints.
      tags:
        - Decks
      security:
        - BearerAuth:
            - user:study:read
      responses:
        '200':
          description: The owner's decks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createDeck
      summary: Create a deck
      description: Creates a new deck. Writing personal SRS data requires Pro.
      tags:
        - Decks
      security:
        - BearerAuth:
            - user:study:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckRequest'
      responses:
        '201':
          description: The created deck.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/decks/{id}:
    patch:
      operationId: updateDeck
      summary: Update a deck
      description: Renames or reconfigures one of the owner's decks. Only the given fields change; requires Pro.
      tags:
        - Decks
      security:
        - BearerAuth:
            - user:study:write
      parameters:
        - name: id
          in: path
