            terms:
              type: integer
              minimum: 0
            kanji:
              type: integer
              minimum: 0
            sentences:
              type: integer
              minimum: 0
        audio:
          type: object
          description: |
            How to name a pronunciation clip, instead of shipping a pre-hashed URL on
            every pitch row. The client hashes `reading · accent · speaker ·
            engineVersion · salt` (joined by `separator`, SHA-256, hex) and builds
            `{baseUrl}/{path}/{digest}.{extension}`. None of it is secret: the pack
            published every URL it named, against a public-read bucket.
          additionalProperties: false
          required:
            - baseUrl
            - path
            - extension
            - separator
            - engineVersion
            - salt
            - defaultVoice
            - voices
          properties:
            baseUrl:
              type: string
              format: uri
            path:
              type: string
            extension:
              type: string
            separator:
              type: string
            engineVersion:
              type: integer
              minimum: 1
            salt:
              type: string
            defaultVoice:
              type: string
            voices:
              type: object
              additionalProperties:
                type: integer
        languages:
          type: array
          items:
            type: string
        dictionaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - slug
            properties:
              slug:
                type: string
              version:
                type:
                  - string
                  - 'null'
              languages:
                type: array
                minItems: 1
                items:
                  type: string
        modifications:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - url
              - license
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              license:
                type: string
              licenseUrl:
                type: string
                format: uri
    DictionaryStackManifest:
      type: object
