        - translations
        - source
        - matches
      properties:
        id:
          type: string
          description: Stable sentence handle accepted by `GET /api/v1/sentences/{id}`.
          example: tatoeba:123456
        japanese:
          type: string
          example: 猫が好きです。
        translations:
          type: array
