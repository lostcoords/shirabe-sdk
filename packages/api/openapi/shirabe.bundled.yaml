          const: application/x-ndjson
        bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        downloadUrl:
          type: string
          format: uri
        counts:
          type: object
          additionalProperties: false
