          description: Gzip-compressed newline-delimited JSON records.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/dictionary-packs/{slug}/{revision}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: revision
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{16}$
    get:
      operationId: getDictionaryPack
      summary: Get an immutable dictionary pack
      description: |
        Downloads an immutable personal-dictionary overlay available to the
