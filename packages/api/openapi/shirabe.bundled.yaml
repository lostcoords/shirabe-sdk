          type:
            - integer
            - 'null'
          example: 11
        levels:
          type: object
          required:
            - grade
            - jlpt
            - kanken
          properties:
            grade:
              type:
                - integer
                - 'null'
            jlpt:
              type:
                - string
                - 'null'
              example: N2
            kanken:
              type:
                - string
                - 'null'
              example: 準2
        frequencyRank:
          type:
            - integer
            - 'null'
          description: Newspaper-frequency rank; lower values are more frequent.
          example: 1208
        meanings:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        readings:
          type: object
          required:
            - 'on'
            - kun
            - nanori
          properties:
            'on':
              type: array
              items:
                type: string
              example:
                - ビョウ
            kun:
              type: array
              items:
                type: string
              example:
                - ねこ
            nanori:
              type: array
              items:
                type: string
            foreign:
              type: object
              description: Present when `include=foreignReadings`.
              properties:
                pinyin:
                  type: array
                  items:
                    type: string
                koreanH:
                  type: array
                  items:
                    type: string
                koreanR:
                  type: array
                  items:
                    type: string
                vietnam:
                  type: array
                  items:
                    type: string
        classification:
          type: object
          required:
            - radical
            - components
            - structure
          properties:
            radical:
              oneOf:
                - $ref: '#/components/schemas/Radical'
                - type: 'null'
            components:
              type: array
              items:
                type: string
            structure:
              type:
                - string
                - 'null'
              description: Ideographic Description Sequence.
        etymology:
          type:
            - object
            - 'null'
          properties:
            text:
              type: string
            rikusho:
              type: string
              example: 形声
            via:
              type:
                - string
                - 'null'
            source:
              type: string
        lookalikes:
          type: array
          items:
            type: string
          example:
            - 描
            - 苗
        references:
          type: object
          description: Present when `include=references`.
          properties:
            dictRefs: {}
            queryCodes: {}
            codepoints: {}
            variants: {}
    KanjiResponse:
      type: object
      required:
        - kanji
        - relationships
      properties:
        kanji:
          $ref: '#/components/schemas/Kanji'
        relationships:
          type: object
          properties:
            compounds:
              type: array
              items:
                $ref: '#/components/schemas/KanjiCompound'
            readingExamples:
              type: array
              items:
                type: object
                required:
                  - reading
                  - words
                properties:
                  reading:
                    type: string
                  words:
                    type: array
                    items:
                      type: object
                      required:
                        - headword
                        - reading
                      properties:
                        headword:
                          type: string
                        reading:
                          type: string
            lookalikes:
              type: array
              items:
                $ref: '#/components/schemas/KanjiSummary'
            relatedKanji:
              $ref: '#/components/schemas/KanjiRelationshipPreview'
            radicalMembers:
              $ref: '#/components/schemas/KanjiRelationshipPreview'
            strokeOrder:
              type: object
              required:
                - svg
                - composition
              properties:
                svg:
                  type:
                    - string
                    - 'null'
                composition:
                  oneOf:
                    - type: object
                    - type: 'null'
    KanjiCompound:
      type: object
      description: Lightweight JMdict reference for the kanji compounds list.
      required:
        - id
        - headword
        - definitions
      properties:
        id:
          type: string
          description: Stable word-card identifier accepted by `GET /api/v1/words/{id}`.
          example: 食べる
        headword:
          type: string
          example: 食べる
        reading:
          type:
            - string
            - 'null'
          example: たべる
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
    KanjiRelationshipPreview:
      type: object
      description: A bounded relationship preview and the route for retrieving the complete collection.
      required:
        - count
        - items
        - next
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/KanjiSummary'
        next:
          type:
            - string
            - 'null'
          description: Relative API route for the complete collection, or null when the preview is complete.
    KanjiSummary:
      type: object
      description: |
        Compact KANJIDIC entry for index pages. Carries the at-a-glance
        fields the kanji-index grid renders. Call `/api/v1/kanji/{character}` for
        the full record (readings, meanings, compounds).
      required:
        - character
        - levels
      properties:
        character:
          type: string
          example: 食
        strokes:
          type:
            - integer
            - 'null'
          example: 9
        levels:
          type: object
          required:
            - grade
            - jlpt
            - kanken
          properties:
            grade:
              type:
                - integer
                - 'null'
              example: 2
            jlpt:
              type:
                - string
                - 'null'
              example: N4
            kanken:
              type:
                - string
                - 'null'
              example: '7'
        frequencyRank:
          type:
            - integer
            - 'null'
          example: 422
    KanjiIndex:
      type: object
      description: |
        Browseable KANJIDIC index, grouped by the chosen field.
        `count` is the total number of kanji surfaced after any filter is
        applied (sums across groups).
      required:
        - groupBy
        - count
        - groups
      properties:
        groupBy:
          type: string
          enum:
            - jlpt
            - kanken
            - strokes
            - radical
            - frequency
          example: jlpt
        count:
          type: integer
          example: 2136
        groups:
          type: array
          items:
            $ref: '#/components/schemas/KanjiIndexGroup'
    KanjiIndexGroup:
      type: object
      description: |
        One section of the kanji index. `value` is the raw grouping value
        (integer for strokes/radical, "Nx" string for jlpt, level string for
        kanken, frequency bucket symbol for frequency, null for unsorted).
        When ordered by `radical`, a `radical` object is included so clients
        don't need a second round trip to render the section header.
      required:
        - value
        - count
        - kanji
      properties:
        value:
          description: Grouping value; its type depends on `groupBy`.
          oneOf:
            - type: integer
            - type: string
            - type: 'null'
          example: 2
        radical:
          description: Present when `groupBy=radical`. The radical for this group.
          $ref: '#/components/schemas/Radical'
        count:
          type: integer
          description: Total characters in this group before pagination or previewing.
        kanji:
          type: array
          items:
            $ref: '#/components/schemas/KanjiSummary'
        pagination:
          description: Present when `filter[group]` selects this group.
          $ref: '#/components/schemas/CursorPagination'
    Radical:
      type: object
      description: |
        One radical (部首). The `number` field (1-214) is the stable
        identifier, a few radicals have multiple Unicode glyph forms, but the
        number is stable. `variants` lists alternate forms (e.g. 氵 and ⺡ for
        radical 85, water).
      required:
        - number
        - glyph
        - strokes
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 214
          example: 85
        glyph:
          type: string
          description: Canonical display glyph.
          example: ⽔
        strokes:
          type: integer
          example: 4
        meaning:
          type:
            - string
            - 'null'
          example: water
        jpName:
          type:
            - string
            - 'null'
          description: Japanese name (hiragana).
          example: みず
        romaji:
          type:
            - string
            - 'null'
          example: mizu
        positionJp:
          type:
            - string
            - 'null'
          description: Position-of-use label (へん, つくり, etc.).
        positionRomaji:
          type:
            - string
            - 'null'
        variants:
          type: array
          description: Alternate Unicode forms of this radical, when any.
          items:
            $ref: '#/components/schemas/RadicalVariant'
    RadicalVariant:
      type: object
      description: An alternate Unicode form of a canonical radical.
      required:
        - glyph
      properties:
        glyph:
          type: string
          example: ⺡
        meaning:
          type:
            - string
            - 'null'
        jpName:
          type:
            - string
            - 'null'
        romaji:
          type:
            - string
            - 'null'
        positionJp:
          type:
            - string
            - 'null'
        positionRomaji:
          type:
            - string
            - 'null'
    RadicalIndex:
      type: object
      description: Radical forms grouped like the website chart.
      required:
        - groupBy
        - count
        - groups
      properties:
        groupBy:
          type: string
          enum:
            - strokes
            - number
            - position
        count:
          type: integer
          description: Total displayed radical forms, including variants.
        groups:
          type: array
          items:
            type: object
            required:
              - value
              - radicals
            properties:
              value:
                oneOf:
                  - type: integer
                  - type: string
                  - type: 'null'
              radicals:
                type: array
                items:
                  $ref: '#/components/schemas/RadicalCell'
    RadicalCell:
      type: object
      description: One displayed radical form, linked to its radical number.
      required:
        - radicalNumber
        - glyph
        - strokes
        - meaning
        - jpName
        - variant
        - position
        - shape
      properties:
        radicalNumber:
          type: integer
          minimum: 1
          maximum: 214
        glyph:
          type:
            - string
            - 'null'
        strokes:
          type: integer
        meaning:
          type:
            - string
            - 'null'
        jpName:
          type:
            - string
            - 'null'
        variant:
          type: boolean
        position:
          type:
            - string
            - 'null'
        shape:
          oneOf:
            - type: object
              required:
                - path
                - viewBox
              properties:
                path:
                  type: string
                viewBox:
                  type: string
            - type: 'null'
    RadicalResponse:
      type: object
      required:
        - radical
        - count
        - kanji
        - pagination
      properties:
        radical:
          $ref: '#/components/schemas/Radical'
        kanji:
          type: array
          description: KANJIDIC characters using this radical.
          items:
            $ref: '#/components/schemas/KanjiSummary'
        count:
          type: integer
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    KanjiComponent:
      type: object
      description: A glyph used for component-based kanji discovery.
      required:
        - glyph
        - strokes
      properties:
        glyph:
          type: string
          example: 氵
        strokes:
          type: integer
          example: 3
        meaning:
          type:
            - string
            - 'null'
        jpName:
          type:
            - string
            - 'null'
        romaji:
          type:
            - string
            - 'null'
    KanjiComponentIndex:
      type: object
      required:
        - count
        - groups
      properties:
        count:
          type: integer
          example: 253
        groups:
          type: array
          items:
            type: object
            required:
              - strokes
              - components
            properties:
              strokes:
                type: integer
              components:
                type: array
                items:
                  $ref: '#/components/schemas/KanjiComponent'
    KanjiComponentMatches:
      type: object
      required:
        - components
        - count
        - groups
        - availableComponents
        - pagination
      properties:
        components:
          type: array
          items:
            type: string
          example:
            - 氵
            - 木
        count:
          type: integer
          description: Total matches before the response limit is applied.
        groups:
          type: array
          items:
            type: object
            required:
              - strokes
              - matches
            properties:
              strokes:
                type:
                  - integer
                  - 'null'
              matches:
                type: array
                items:
                  $ref: '#/components/schemas/KanjiSummary'
        availableComponents:
          type: array
          description: Components that can still narrow the current selection.
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    Me:
      type: object
      description: The API key owner's profile, limits, and SRS entitlement.
      required:
        - user
        - rateLimit
        - payloadLimit
        - credential
        - entitlement
      properties:
        user:
          type: object
          required:
            - name
            - displayName
            - memberDays
            - admin
          properties:
            name:
              type: string
            displayName:
              type: string
            memberDays:
              type: integer
              example: 142
            admin:
              type: boolean
        rateLimit:
          description: Budgets that refill. Exceeding one answers 429 `RATE_LIMIT_EXCEEDED` with a `Retry-After`, so the request is fine and the timing is not.
          type: object
          required:
            - requestsPerMinute
            - tokenizationCharactersPerMinute
          properties:
            requestsPerMinute:
              type: integer
              example: 60
            tokenizationCharactersPerMinute:
              description: Parsing is charged by the character, because one call carries one text or two hundred. It spends this budget AND a request from the count above.
              type: integer
              example: 100000
        payloadLimit:
          description: 'What one request may carry, which is not a budget: over it is 413 `TEXT_TOO_LARGE`, there is no `Retry-After`, and waiting changes nothing. Split the text, or send it as a `texts` batch whose combined length fits.'
          type: object
          required:
            - tokenizationCharactersPerRequest
          properties:
            tokenizationCharactersPerRequest:
              type: integer
              example: 10000
        credential:
          type: object
          description: What THIS credential may do, which is a different question from what its owner may do. A connected app compares its own requirements against `scopes` to find out that it needs the reader to re-approve, on a call it is already making, instead of discovering it from a 403 in front of them.
          required:
            - kind
            - scopes
          properties:
            kind:
              type: string
              enum:
                - api_key
                - oauth
              description: A personal API key, or an app acting under an OAuth grant.
            scopes:
              type: array
              description: The scopes this credential carries. Legacy Nadeshiko grants return READ_DICTIONARY and READ_ACCOUNT until its new SDK reaches production.
              items:
                type: string
              example:
                - user:dictionary:read
                - user:profile:read
            client:
              type: string
              description: The registered name of the app behind an OAuth grant. Absent on a personal API key, which has no app behind it to name.
              example: Nadeshiko
        preferences:
          type: object
          deprecated: true
          description: Legacy Nadeshiko account-stack snapshot, only for legacy Nadeshiko OAuth grants. Remove when its new card/API SDK client reaches production.
          required:
            - dictionaries
            - dictionaryNames
            - stackFingerprint
            - stackIsPrivate
          properties:
            dictionaries:
              type: array
              items:
                type: string
            dictionaryNames:
              type: object
              additionalProperties:
                type: string
            stackFingerprint:
              type: string
            stackIsPrivate:
              type: boolean
        entitlement:
          type: object
          description: 'SRS entitlement, the same predicate the write endpoints gate on: a Pro subscription or a school membership. Clients (e.g. the browser extension) gate their write features on `srs`.'
          required:
            - srs
            - subscribed
            - plan
          properties:
            srs:
              type: boolean
              description: True when the owner may write to the SRS (Pro or a school member).
            subscribed:
              type: boolean
              description: True when the owner holds a Pro subscription (excludes school-only entitlement).
            plan:
              type: string
              example: pro
    OauthTokenRequest:
      type: object
      description: |
        A token request (RFC 6749 §4.1.3, §6; RFC 8628 §3.4). Which fields matter
        depends on `grant_type`; the rest are ignored. `client_id` is always
        required unless the client authenticates with HTTP Basic; `client_secret`
        is required for a confidential client.
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          description: '`authorization_code`, `refresh_token`, `client_credentials` or `urn:ietf:params:oauth:grant-type:device_code`. Anything else answers `unsupported_grant_type`.'
          example: authorization_code
        client_id:
          type: string
          description: The registered client id.
        client_secret:
          type: string
          description: For a confidential client. Or send both as HTTP Basic instead.
        code:
          type: string
          description: '`authorization_code`: the one-time code received on the redirect.'
        code_verifier:
          type: string
          description: '`authorization_code`: the PKCE verifier whose S256 hash was sent to /oauth/authorize.'
        redirect_uri:
          type: string
          description: '`authorization_code`: must match the redirect_uri used to obtain the code.'
        resource:
          type: string
          format: uri
          description: The protected resource requested. It must match the authorization grant, or is bound to a client-credentials token. Only identified legacy Nadeshiko authorization codes and grants may omit it; an explicit mismatch is always rejected. Remove this fallback when its new card/API SDK reaches production.
        refresh_token:
          type: string
          description: '`refresh_token`: the refresh token from the last pair. Single-use.'
        device_code:
          type: string
          description: 'device grant: the `device_code` from /oauth/device_authorization.'
    OauthTokenResponse:
      type: object
      description: A fresh access token. User-delegated grants also include a single-use refresh token.
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
          description: 'Send as `Authorization: Bearer …`. Lives `expires_in` seconds.'
          example: shra_9tKp…
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 3600
        refresh_token:
          type: string
          description: User-delegated grants only. Trade for the next pair at this endpoint; single-use and rotating.
          example: shrr_Qm2c…
        scope:
          type: string
          description: The granted scopes, space-separated. Legacy Nadeshiko grants return READ_DICTIONARY and READ_ACCOUNT until its new card/API SDK reaches production.
          example: user:dictionary:read user:profile:read
    OauthRevokeRequest:
      type: object
      description: A revocation request (RFC 7009 §2.1).
      required:
        - token
      properties:
        token:
          type: string
          description: An access token or refresh token the client holds. Its whole grant is revoked.
        token_type_hint:
          type: string
          enum:
            - access_token
            - refresh_token
          description: Optional, and unnecessary here (both kinds are recognised by prefix).
        client_id:
          type: string
        client_secret:
          type: string
          description: For a confidential client. Or send both as HTTP Basic instead.
    OauthDeviceAuthorizationRequest:
      type: object
      description: Start the device flow (RFC 8628 §3.1).
      required:
        - client_id
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          description: For a confidential client.
        scope:
          type: string
          description: Space-separated. Narrowed to what the client registered for; omitted means the default read set.
          example: user:dictionary:read user:study:read
        resource:
          type: string
          format: uri
          description: The Shirabe protected resource the resulting tokens may access.
    OauthDeviceAuthorization:
      type: object
      description: A started device handshake (RFC 8628 §3.2).
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          description: Poll the token endpoint with this. Never shown to the user.
        user_code:
          type: string
          description: Show this to the user; they type it on `verification_uri`.
          example: WDJB-MJHT
        verification_uri:
          type: string
          format: uri
          example: https://shirabe.org/link
        verification_uri_complete:
          type: string
          format: uri
          example: https://shirabe.org/link?code=WDJB-MJHT
        expires_in:
          type: integer
          description: Seconds until the handshake expires.
          example: 600
        interval:
          type: integer
          description: Minimum seconds between polls.
          example: 5
    ErrorOauth:
      type: object
      description: |
        A failure at an OAuth endpoint: RFC 6749 §5.2 / RFC 8628 §3.5 `error` and
        `error_description`, alongside the same problem fields every other error
        carries. `code` is `error` upper-cased.
      required:
        - type
        - title
        - status
        - code
        - error
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          enum:
            - 400
            - 401
        detail:
          type: string
        code:
          type: string
          enum:
            - INVALID_CLIENT
            - INVALID_GRANT
            - INVALID_SCOPE
            - INVALID_TARGET
            - UNSUPPORTED_GRANT_TYPE
            - AUTHORIZATION_PENDING
            - SLOW_DOWN
            - ACCESS_DENIED
            - EXPIRED_TOKEN
        error:
          type: string
          enum:
            - invalid_client
            - invalid_grant
            - invalid_scope
            - invalid_target
            - unsupported_grant_type
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
        error_description:
          type: string
        instance:
          type: string
    TagList:
      type: object
      description: The code dictionary resolving coded fields to labels + descriptions.
      required:
