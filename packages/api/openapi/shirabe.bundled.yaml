  /api/v1/srs/cards:
    get:
      operationId: listCards
      summary: List the owner's saved cards
      description: |
        The API key owner's cards, paginated with an opaque cursor and filterable
        by `deck`, `state`, an exact `lemma` (+ `reading`), or a `q` text search.

        A word can hold a card per meaning, so `lemma` is how you list every card a
        word holds: `q` cannot answer that, since it matches substrings and searches
        the meaning text too.
      tags:
        - Cards
      security:
        - BearerAuth:
            - user:study:read
      parameters:
        - name: deck
          in: query
          required: false
          description: Restrict to one deck (its id).
          schema:
            type: integer
        - name: state
          in: query
          required: false
          description: |
            Restrict by card state. Scheduled cards group by the learner-facing stability ladder (`apprentice` / `proficient` / `master`), not FSRS's internal learning/review/relearning states. `linked` returns cards that follow a dictionary entry and `unlinked` those that need a dictionary-link review. `ignored` is always empty because an ignored word is deliberately not a card. An unknown value is a 400.
          schema:
            type: string
            enum:
              - all
              - due
              - new
              - apprentice
              - proficient
              - master
              - retired
              - suspended
              - leech
              - linked
              - unlinked
              - trash
              - ignored
        - name: lemma
          in: query
          required: false
          description: |
            Exact dictionary form (card front). Returns every card the word holds :  one per saved meaning, plus a whole-word card if there is one.
          schema:
            type: string
          example: 今日
        - name: reading
          in: query
          required: false
          description: |
            Exact reading, to disambiguate a front that is read more than one way (生: なま / せい). Only meaningful alongside `lemma`.
          schema:
            type: string
          example: キョウ
        - name: q
          in: query
          required: false
          description: |
            Text search across front, reading and meaning: the website card browser's search. For "every card of this word", use `lemma` instead.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: bulkUpdateCards
      summary: Bulk-update the owner's cards
      description: |
        Apply one lifecycle / deck action to many of the owner's
        cards at once (docs/srs.md §9). Scoped to the caller: ids that aren't the
        owner's are ignored. `cardAction` names the operation (`action` is reserved).

        `delete` soft-deletes into the trash (recoverable) and `restore` brings those
        back; **`purge` is the permanent destroy** and cascades the cards' review
        history. `reset` returns cards to new but keeps their `Review` rows.
      tags:
        - Cards
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ids
                - cardAction
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items:
                    type: integer
                  description: The card ids to act on.
                cardAction:
                  type: string
                  enum:
                    - suspend
                    - unsuspend
                    - retire
                    - reset
                    - refresh
                    - move
                    - delete
                    - restore
                    - purge
                  description: |
                    `refresh` recomposes the meanings of cards that match a dictionary entry with that entry's current definition ("use Shirabe definition").
                deckId:
                  type: integer
                  description: Target deck for cardAction=move.
      responses:
        '200':
          description: How many cards were updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated
                properties:
                  updated:
                    type: integer
                    example: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
