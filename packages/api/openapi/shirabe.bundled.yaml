  /api/v1/me:
    get:
      operationId: getMe
      summary: API key owner profile and limits
      description: |
        Returns the profile, the limits this key is held to, and
        dictionary preferences for the user that owns the API key. All of it is
        covered by user:profile:read.
      tags:
        - Account
      security:
        - BearerAuth:
            - user:profile:read
      responses:
        '200':
          description: Account profile and usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/me/key:
    delete:
      operationId: revokeOwnKey
      summary: Revoke the credential this request was made with
      description: |
        Cuts off the credential the request arrived on, immediately and
        permanently: a personal API key, or for an app, the whole OAuth grant its
        access token belongs to. An OAuth client should prefer
        `POST /api/v1/oauth/revoke` (RFC 7009), which takes the token in the body;
        this exists so a client holding nothing but an access token can still let
        go, and so an API key can revoke itself.

        Needs no scope. A credential proves it is itself by being the one on the
        request, and gating this would let a narrow one be handed out and never
        taken back.

        Revocation is soft and terminal: it stops working at once and cannot be
        restored. Reconnect (or mint a new key) to come back. A second call
        answers 401, because by then it can no longer authenticate.
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The credential is revoked. Nothing is returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/preferences:
    get:
      operationId: getPreferences
      summary: Get the API key owner's reader preferences
      tags:
        - Account
      security:
        - BearerAuth:
            - user:preferences:read
      responses:
        '200':
          description: Reader preferences.
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    type: object
                    required:
                      - uiLocale
                      - sentenceLanguages
                      - sentenceTranslation
                    properties:
                      uiLocale:
                        type: string
                      sentenceLanguages:
                        type: array
                        items:
                          type: string
                      sentenceTranslation:
                        type: string
                        enum:
                          - show
                          - hover
                          - hide
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updatePreferences
      summary: Update the API key owner's reader preferences
      description: |
        A partial update, send only the fields you want to change.

        `sentenceLanguages` (ordered, `ja` = immersion) and `sentenceTranslation` (show|hover|hide) are separate axes governing example sentences.
      tags:
        - Account
      security:
        - BearerAuth:
            - user:preferences:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                sentenceLanguages:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: Ordered example-sentence languages; `ja` is the immersion marker.
                  items:
                    type: string
                    enum:
                      - ja
                      - en
                      - es
                      - fr
                      - de
                      - nl
                      - ru
                      - sv
                      - hu
                      - sl
                sentenceTranslation:
                  type: string
                  description: How an example sentence's translation is revealed.
                  enum:
                    - show
                    - hover
                    - hide
      responses:
        '200':
          description: Updated reader preferences.
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    type: object
                    required:
                      - sentenceLanguages
                      - sentenceTranslation
                    properties:
                      sentenceLanguages:
                        type: array
                        items:
                          type: string
                      sentenceTranslation:
                        type: string
                        enum:
                          - show
                          - hover
                          - hide
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji:
    get:
      operationId: listKanji
      summary: Browse the kanji index
      description: |
        Returns the KANJIDIC index that backs the website's `/kanji`
        page, grouped by `groupBy`. Without a group filter, each group contains a
        small preview. Pass `filter[group]` to paginate one complete group. For
        example, `?groupBy=kanken&filter[group]=2` returns level-2 kanji.

        JLPT and Kanken grouping include characters ranked by those systems. Stroke,
        radical, and frequency grouping include every available KANJIDIC character.
        The dictionary data is versioned, so this endpoint is safe to cache.
      tags:
        - Kanji
      parameters:
        - name: groupBy
          in: query
          required: false
          description: Which field to group + sort by.
          schema:
            type: string
            enum:
              - jlpt
              - kanken
              - strokes
              - radical
              - frequency
            default: jlpt
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: Index filters. `group` uses the value format selected by `groupBy`.
          schema:
            type: object
            properties:
              group:
                type: string
                minLength: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Grouped kanji index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiIndex'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji/radicals:
    get:
      operationId: listKanjiRadicals
      summary: List radicals
      description: Returns radicals (部首) and their displayed forms using the website's grouping.
      tags:
        - Kanji
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - strokes
              - number
              - position
            default: strokes
      responses:
        '200':
          description: Grouped radical forms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadicalIndex'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji/radicals/{number}:
    get:
      operationId: getKanjiRadical
      summary: Get a radical
      description: Returns one radical and a cursor-paginated list of all KANJIDIC characters that use it.
      tags:
        - Kanji
      parameters:
        - name: number
          in: path
          required: true
          description: Radical number, 1-214.
          schema:
            type: integer
            minimum: 1
            maximum: 214
          example: 85
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Radical and member kanji.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadicalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji/components:
    get:
      operationId: listKanjiComponents
      summary: List kanji components
      description: Returns the component glyphs available for component-based kanji discovery.
      tags:
        - Kanji
      responses:
        '200':
          description: Components grouped by stroke count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiComponentIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji/component-matches:
    get:
      operationId: listKanjiComponentMatches
      summary: Find kanji by components
      description: |
        Returns kanji containing every requested component, plus components that
        can still narrow the current selection.
      tags:
        - Kanji
      parameters:
        - name: components
          in: query
          required: false
          description: Component glyphs that every returned character must contain.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching kanji and available components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiComponentMatches'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/kanji/{character}:
    get:
      operationId: getKanji
      summary: Look up a kanji
      description: |
        Returns the KANJIDIC character. Use `include` for dictionary-aware compounds
        and the optional relationships shown by the website.
      tags:
        - Kanji
      parameters:
        - name: character
          in: path
          required: true
          description: Exactly one Unicode grapheme. URL-encode the kanji when needed.
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: 食
        - name: include
          in: query
          required: false
          description: Optional character detail blocks.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - compounds
                - readingExamples
                - lookalikes
                - relatedKanji
                - radicalMembers
                - strokeOrder
                - references
                - foreignReadings
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Kanji entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  schemas:
    SearchRequest:
      type: object
      additionalProperties: false
      description: |
        Search request. `query` is the only required field. When `filters.sources`
        is omitted, the API key owner's saved dictionary stack applies.
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Lexical terms (kanji, kana, or romaji/meaning) plus optional inline
            `#key:value` filters, the same grammar as the website search bar. Use
            `filters` below instead for structured/programmatic filtering; the two
            are merged.
          example: ねこ
        filters:
          type: object
          additionalProperties: false
          description: |
            Structured filters (merged with any inline `#key:value` in `query`).
            Values accept aliases or codes, lists (`v1,v5k`), ranges (`n5-n3`), and
            comparators (`<2000`).
          properties:
            pos:
              type: string
              example: 'n'
            field:
              type: string
            misc:
              type: string
            dialect:
              type: string
            name:
              type: string
            jlpt:
              type: string
              example: N5
            freq:
              type: string
            script:
              type: string
            common:
              type: boolean
            sources:
              type: array
              minItems: 1
              maxItems: 128
              description: |
                Ordered dictionary stack for this request. Array order sets dictionary
                priority; language order sets definition priority within a dictionary.
                This overrides saved preferences without changing them. Only sources
                available to the credential are used.
              items:
                $ref: '#/components/schemas/SearchSource'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Maximum number of ranked matches to return per resolved segment.
        include:
          type: array
          description: |
            Opt-in extras for every match: `kanji` (character cards) and `sentences`
            (example preview).
          items:
            type: string
            enum:
              - kanji
              - sentences
          uniqueItems: true
    SearchResults:
      type: object
      description: |
        Shirabe's preferred dictionary-aware interpretation of the query. Segments
        preserve their UTF-16 positions and contain best-first word-card matches.
        Fields requested through `include` appear only when requested.
      required:
        - query
        - segments
      properties:
        query:
          type: string
          description: Echoes the input query.
        segments:
          type: array
          description: The preferred query segmentation, in source-text order.
          items:
            $ref: '#/components/schemas/SearchSegment'
    IdentifyRequest:
      type: object
      additionalProperties: false
      description: Surrounding text and the UTF-16 target where popup lookup begins.
      required:
        - text
        - target
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: The surrounding sentence or bounded Japanese text run.
          example: 今日はいい天気ですね
        target:
          type: object
          additionalProperties: false
          description: The clicked position and optional token boundary supplied by the caller.
          required:
            - startOffset
          properties:
            startOffset:
              type: integer
              minimum: 0
              description: Inclusive UTF-16 code-unit offset where Shirabe starts scanning for dictionary expressions.
              example: 0
            endOffset:
              type: integer
              minimum: 1
              description: Optional exclusive UTF-16 code-unit boundary hint. It ranks that span first but does not exclude overlapping spans.
              example: 3
    IdentifyResults:
      type: object
      additionalProperties: false
      description: Dictionary-bearing spans beginning at the requested position, best first.
      required:
        - text
        - stackFingerprint
        - spans
      properties:
        text:
          type: string
          description: Echoes the submitted text.
        stackFingerprint:
          type: string
          pattern: ^[a-f0-9]{16}$
          description: Fingerprint of the dictionary configuration used for these results.
        spans:
          type: array
          description: Possible dictionary expression lengths beginning at `startOffset`, best first.
          items:
            $ref: '#/components/schemas/SearchSegment'
    SearchSource:
      type: object
      additionalProperties: false
      description: One dictionary and its ordered definition languages.
      required:
        - dictionary
        - languages
      properties:
        dictionary:
          type: string
          minLength: 1
          maxLength: 128
          description: Dictionary slug from `GET /api/v1/dictionaries`.
          example: jmdict
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ordered ISO 639-1 definition languages for this dictionary.
          items:
            type: string
            enum:
              - ja
              - en
              - es
              - fr
              - de
              - nl
              - ru
              - sv
              - hu
              - sl
          example:
            - es
            - en
    Result:
      type: object
      description: |
        One search match, a headword merged across dictionaries. `id` is the
        headword slug for GET /api/v1/words/{id}.
      required:
        - id
        - headword
        - matchType
        - furigana
        - common
        - pitch
        - forms
        - entries
      properties:
        id:
          type: string
          description: |
            The handle that reopens THIS result at `GET /api/v1/words/{id}`: the same one the website links with. Usually the headword plus its reading (顔-かお), and a trailing source id where the reading still cannot tell two entries apart. Not always the `headword` field: a bare spelling would hand every homograph sharing it to whichever entry resolves first.
          example: 顔-かお
        headword:
          type: string
          example: 顔
        matchedHeadword:
          type: string
          description: |
            For identify results, the kanji spelling that matched the selected text or its dictionary form when it differs from the canonical headword. Display this spelling when present; keep id and headword as the entry identity.
          example: 生
        matchedFurigana:
          type: array
          description: Reading aligned to matchedHeadword; canonical furigana stays unchanged.
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
              ruby:
                type: string
        reading:
          type:
            - string
            - 'null'
          example: かお
        matchType:
          type: string
          enum:
            - writing
            - reading
            - meaning
          description: How the query matched this result.
        furigana:
          type: array
          description: Reading aligned to the headword (ruby omitted over kana runs).
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
              ruby:
                type: string
        common:
          type: boolean
        jlpt:
          type:
            - string
            - 'null'
          example: N4
        frequency:
          type:
            - integer
            - 'null'
          description: Corpus rank (lower = more common).
        pitch:
          type: array
          items:
            type: object
            required:
              - downstep
              - pattern
            properties:
              downstep:
                type: integer
              pattern:
                type: string
                enum:
                  - heiban
                  - atamadaka
                  - nakadaka
                  - odaka
              audioUrl:
                type:
                  - string
                  - 'null'
                description: Pre-generated clip of the reading spoken at this accent; null when unavailable.
              audioDownloadUrl:
                type: string
                description: Verified published MP3 copy of this recording for offline use; absent when unavailable.
              autogenerated:
                type: boolean
                description: True when no dictionary lists this pitch and it's an automatic model estimate.
        forms:
          type: array
          items:
            $ref: '#/components/schemas/Form'
        entries:
          type: array
          description: One per contributing dictionary, in the caller's preference order.
          items:
            $ref: '#/components/schemas/Entry'
        kanji:
          type: array
          description: Only with include=kanji, kanji cards for the headword's characters.
          items:
            $ref: '#/components/schemas/KanjiCard'
        sentences:
          type: array
          description: |
            Only with include=sentences, a capped preview. The full paginated set
            is at GET /api/v1/sentences?query=<headword>.
          items:
            $ref: '#/components/schemas/Sentence'
    Entry:
      type: object
      description: |
        One dictionary's record for the word. Generic across dictionaries. JMdict,
        JMnedict, Wikipedia, and user uploads all populate the same container.
      required:
        - dictionary
        - type
        - sourceId
        - senses
      properties:
        dictionary:
          type: string
          description: Dictionary slug (resolve via GET /api/v1/dictionaries).
          example: jmdict
        dictionaryName:
          type: string
          description: 'What that dictionary is CALLED. A slug is not a name: a reader''s own uploads are filed under a hash of their contents, so a client attributing these senses on screen prints a hash without this.'
          example: JMdict
        type:
          type: string
          description: Dictionary kind.
          example: definition
        sourceId:
          type: string
          description: The record's identifier within that dictionary.
        senses:
          type: array
          items:
            $ref: '#/components/schemas/Sense'
        sourceHeadwords:
          type: array
          description: Source-specific tags and rules retain their spelling and reading association.
          items:
            $ref: '#/components/schemas/SourceHeadword'
    Sense:
      type: object
      description: |
        One dictionary sense in display order. `position` selects the sense when
        saving; `label` and `depth` preserve the publisher's numbering and hierarchy.
        Definitions, usages and tags remain separate. Individual fields document
        whether they require the detail endpoint.
      required:
        - position
        - definitions
        - tags
      properties:
        ref:
          type: string
          description: |
            How a save names this sense: `"<dictionary slug>#<that dictionary's own 0-based number>"`. Pass it in `senses[]` to scope a card to this sense.
          example: jmdict#2
        position:
          type: integer
          minimum: 0
          description: |
            0-based sense position within the entry, the value to send in
            `senses` to scope a saved card to this sense, qualified by its dictionary
            slug as `"<slug>#<position>"`. Positions can be
            non-contiguous when a sense is filtered out for the requested languages.
            Stable within a dictionary version, but a re-import can shift it; it is a
            selector to post straight back on a save, not a durable id to cache. The
            server resolves it against the current entry into a content-keyed anchor,
            so a saved card survives later re-imports.
        depth:
          type: integer
          minimum: 0
          maximum: 2
          description: |
            Which TIER the dictionary put this sense at: `0` a group, `1` a sense,
            `2` a sub-sense of the sense above it. Senses arrive in display order, so
            a client nests by reading this down the list.

            Computed from the publisher label, whose glyph families vary by dictionary.
            An unnumbered sense has depth 1.
          example: 1
        label:
          type: string
          description: Publisher's sense marker, including enclosing group markers. Omitted when unnumbered.
          example: ㊀①
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        usages:
          type: array
          description: |
            Publisher-supplied usage content for this sense. This is separate from
            definitions and corpus-wide examples, and is omitted when the sense has
            none in the requested languages. Usage rows intentionally have no `kind`.
          items:
            type: object
            required:
              - lang
              - text
            properties:
              lang:
                type: string
                description: ISO 639-1 language code.
                example: ja
              text:
                type: string
                example: ドアを開く。
              title:
                type: string
                description: Optional publisher-supplied title for the usage.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        sourceTags:
          type: array
          description: Publisher-defined labels on this definition, separate from grammatical and usage codes.
          items:
            $ref: '#/components/schemas/SourceTag'
        notes:
          type: array
          description: |
            Usage notes on this sense ("usu. in kana"). On `GET /api/v1/words/{id}` always; on `POST /api/v1/words/identify` with `include=notes`. Absent when the sense has none, rather than present and empty.
          items:
            type: string
        related:
          type: array
          items:
            $ref: '#/components/schemas/CrossReference'
        antonyms:
          type: array
          items:
            $ref: '#/components/schemas/CrossReference'
        seeAlso:
          type: array
          items:
            $ref: '#/components/schemas/CrossReference'
        restrictions:
          type: array
          description: Writings this sense is restricted to. Detail endpoint only.
          items:
            type: string
        loanwordSource:
          type:
            - object
            - 'null'
          description: Loanword etymology. Detail endpoint only.
          properties:
            language:
              type: string
            text:
              type:
                - string
                - 'null'
            wasei:
              type: boolean
    Definition:
      type: object
      description: |
        One meaning text in a single language. Equivalent across languages (the
        `en`/`es` entries of a sense are the same meaning); within a language,
        array order is primary-first. `kind` marks non-gloss content.
      required:
        - lang
        - text
      properties:
        lang:
          type: string
          description: ISO 639-1 language code.
          example: en
        text:
          type: string
          example: face
        kind:
          type: string
          enum:
            - gloss
            - meaning
            - translation
            - explanation
            - abstract
          description: Omitted for plain glosses; present for explanations/abstracts.
        title:
          type: string
          description: Optional publisher-supplied title for this definition.
    Tag:
      type: object
      description: |
        A generic usage label, part of speech, misc, field, dialect, name-type,
        writing tag, etc. Dictionary-agnostic: the `category` is open so
        user-uploaded dictionaries can carry their own. Resolve the full code
        dictionary via GET /api/v1/tags.
      required:
        - category
        - code
        - label
      properties:
        category:
          type: string
          example: partOfSpeech
        code:
          type: string
          example: 'n'
        label:
          type: string
          example: noun
        scope:
          type: string
          enum:
            - entry
            - group
            - sense
          description: Where the publisher states this annotation. Present on sense tags, absent on writing tags.
    Form:
      type: object
      description: One written form of the word.
      required:
        - text
        - script
        - common
      properties:
        text:
          type: string
          example: 顔
        script:
          type: string
          enum:
            - kanji
            - kana
            - hanzi_trad
            - hanzi_simp
            - pinyin
            - latin
            - other
        common:
          type: boolean
        tags:
          type: array
          description: Writing tags (rare/irregular/ateji) when present.
          items:
            $ref: '#/components/schemas/Tag'
    KanjiCard:
      type: object
      description: |
        Compact kanji card for the kanji in a headword (search ?include=kanji).
        `char` is the id; fetch the full record at GET /api/v1/kanji/{character}.
      required:
        - char
      properties:
        char:
          type: string
          example: 顔
        meanings:
          type: array
          description: Language-tagged meanings, primary-first.
          items:
            type: object
            required:
              - lang
              - text
            properties:
              lang:
                type: string
              text:
                type: string
        readings:
          type: object
          properties:
            'on':
              type: array
              items:
                type: string
            kun:
              type: array
              items:
                type: string
        strokes:
          type:
            - integer
            - 'null'
        jlpt:
          type:
            - string
            - 'null'
        grade:
          type:
            - integer
            - 'null'
        frequency:
          type:
            - integer
            - 'null'
    Token:
      type: object
      description: One lookup chip produced by Shirabe's Sudachi-based tokenizer.
      required:
        - surface
        - primary
        - kind
      properties:
        surface:
          type: string
          description: Surface form as it appeared in the input.
          example: 食べている
        pos:
          type:
            - string
            - 'null'
          description: Short part-of-speech tag (verb, noun, adj, …).
          example: verb
        primary:
          type: boolean
          description: True for the morpheme used as the search lemma.
          example: true
        lemma:
          type:
            - string
            - 'null'
          description: Dictionary form of the morpheme.
          example: 食べる
        id:
          type: string
          description: |
            The word id this token reads about at `GET /api/v1/words/{id}`. Follow this rather than `lemma`: a lemma is what a form reduces to, which is not always the word on screen (なら reduces to the copula だ and is its own headword meaning "if"). Absent where the dictionary carries no such word.
          example: 食べる-たべる
        reading:
          type:
            - string
            - 'null'
          description: Katakana reading of the surface.
          example: タベテイル
        posFull:
          type: array
          description: Full Sudachi POS chain (6 fields).
          items:
            type: string
        posLabel:
          type:
            - string
            - 'null'
          description: Friendly part-of-speech label (Noun, Verb, Copula, Counter, …).
          example: Verb
        conjType:
          type:
            - string
            - 'null'
          description: Conjugation type (活用型).
        conjForm:
          type:
            - string
            - 'null'
          description: Conjugation form (活用形).
        kind:
          type: string
          enum:
            - word
            - compound
            - inflected
            - counter
            - expression
            - function
            - symbol
          description: Why the surface is one lookup chip.
        morphemes:
          type: array
          description: Grammatical construction of the chip.
          items:
            type: object
            properties:
              surface:
                type: string
              pos:
                type: array
                items:
                  type: string
              lemma:
                type:
                  - string
                  - 'null'
              reading:
                type:
                  - string
                  - 'null'
              conjType:
                type:
                  - string
                  - 'null'
              conjForm:
                type:
                  - string
                  - 'null'
        components:
          type: array
          description: Conservative independently meaningful B-mode parts of a compound or counter.
          items:
            $ref: '#/components/schemas/TokenComponent'
    ParseRequest:
      type: object
      additionalProperties: false
      description: Japanese texts to segment using the caller's active dictionary stack.
      required:
        - texts
      properties:
        texts:
          type: array
          minItems: 1
          description: |
            One or more non-blank texts. Each item produces one index-aligned item in
            `results`. Their combined length counts against the caller's tokenization
            limits reported by `GET /api/v1/me`.
          items:
            type: string
            minLength: 1
          example:
            - 今日はいい天気ですね
        include:
          type: array
          uniqueItems: true
          description: |
            Optional token details. `study` contains private card state and requires
            `user:study:read`; the other values require only `user:dictionary:read`.
            `posFull` and `posLabel` are deprecated legacy Nadeshiko compatibility.
            Remove them when Nadeshiko deploys its new card/API SDK client to production.
          items:
            type: string
            enum:
              - furigana
              - morphology
              - study
              - posFull
              - posLabel
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ordered dictionary sources to use for this parse, such as `jmdict:en`.
          items:
            type: string
            pattern: ^[a-z0-9_-]+:[a-z]{2}$
    Parse:
      type: object
      additionalProperties: false
      description: One preferred, dictionary-aware tokenization for every submitted text.
      required:
        - stackFingerprint
        - packRevision
        - sources
        - results
      properties:
        tokens:
          type: array
          deprecated: true
          description: Legacy Nadeshiko batch token projection, present only when requesting posFull or posLabel. Remove when its new card/API SDK client reaches production.
          items:
            type: array
            items:
              $ref: '#/components/schemas/LegacyParseToken'
        stackFingerprint:
          type: string
          pattern: ^[a-f0-9]{16}$
          description: Fingerprint of the active dictionary stack used to choose token boundaries.
        packRevision:
          type: string
          pattern: ^[a-f0-9]{16}$
          description: Revision of the public dictionary pack whose data the parser used.
        sources:
          type: array
          description: Ordered dictionary and definition-language sources used for this parse.
          items:
            type: string
        results:
          type: array
          description: Tokenization results in the same order as the request's `texts`.
          items:
            type: object
            additionalProperties: false
            required:
              - text
              - tokens
            properties:
              text:
                type: string
                description: The submitted text represented by this result.
              tokens:
                type: array
                description: The preferred segmentation in reading order.
                items:
                  $ref: '#/components/schemas/ParseToken'
    ParseToken:
      type: object
      additionalProperties: false
      description: One token from Shirabe's preferred, dictionary-aware segmentation.
      required:
        - startOffset
        - endOffset
        - surface
        - kind
      properties:
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive start in UTF-16 code units.
          example: 0
        endOffset:
          type: integer
          minimum: 0
          description: Exclusive end in UTF-16 code units.
          example: 2
        surface:
          type: string
          description: Text exactly as it appears in the input.
          example: 今日
        lemma:
          type: string
          description: Preferred dictionary form when one is available.
          example: 今日
        reading:
          type: string
          description: Katakana reading of this occurrence when available.
          example: キョウ
        partOfSpeech:
          type: string
          description: Short machine-readable part-of-speech tag.
          example: noun
        kind:
          type: string
          enum:
            - word
            - compound
            - inflected
            - counter
            - expression
            - function
            - symbol
          description: Why this surface forms one lookup token.
        components:
          type: array
          description: Meaningful parts retained inside a merged token.
          items:
            type: object
            additionalProperties: false
            required:
              - surface
              - startOffset
              - endOffset
            properties:
              surface:
                type: string
              startOffset:
                type: integer
                minimum: 0
              endOffset:
                type: integer
                minimum: 0
              lemma:
                type: string
              reading:
                type: string
              partOfSpeech:
                type: array
                items:
                  type: string
        inflection:
          type: object
          additionalProperties: false
          description: How this occurrence reaches its dictionary form.
          required:
            - base
            - forms
          properties:
            base:
              type: string
              example: 食べる
            forms:
              type: array
              description: Ordered outermost-first.
              items:
                type: object
                additionalProperties: false
                required:
                  - code
                  - label
                properties:
                  code:
                    type: string
                    example: past-tense
                  label:
                    type: string
                    example: past
        furigana:
          type: array
          description: 'Present only with `include: ["furigana"]` and when ruby is needed.'
          items:
            type: object
            additionalProperties: false
            required:
              - text
            properties:
              text:
                type: string
              ruby:
                type: string
        morphology:
          type: object
          additionalProperties: false
          description: 'Present only with `include: ["morphology"]`.'
          properties:
            label:
              type: string
              example: Verb
            partOfSpeech:
              type: array
              items:
                type: string
            conjugationType:
              type: string
            conjugationForm:
              type: string
        study:
          type: object
          description: 'Present only with `include: ["study"]`; requires `user:study:read`.'
          required:
            - state
            - decks
          properties:
            state:
              type: string
              example: learning
            decks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
            cardId:
              type: integer
            cardCount:
              type: integer
            savedSenses:
              type: array
              items:
                type: string
            savedWholeWord:
              type: boolean
            intervals:
              type: object
    ParseOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - id
            - status
            - textCount
            - submittedAt
            - expiresAt
          properties:
            id:
              type: string
            status:
              type: string
              enum:
                - queued
                - running
            textCount:
              type: integer
            submittedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
        - type: object
          additionalProperties: false
          required:
            - id
            - status
            - textCount
            - submittedAt
            - finishedAt
            - expiresAt
            - result
          properties:
            id:
              type: string
            status:
              type: string
              const: done
            textCount:
              type: integer
            submittedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            result:
              $ref: '#/components/schemas/Parse'
        - type: object
          additionalProperties: false
          required:
            - id
            - status
            - textCount
            - submittedAt
            - finishedAt
            - expiresAt
            - error
          properties:
            id:
              type: string
            status:
              type: string
              const: failed
            textCount:
              type: integer
            submittedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            error:
              type: object
              additionalProperties: false
              required:
                - code
                - detail
              properties:
                code:
                  type: string
                  const: PARSE_FAILED
                detail:
                  type: string
                  const: The parse operation could not be completed.
    WordState:
      type: string
      description: |
        A word's learning status in the API key owner's SRS, weakest → strongest.
        `none` means the user has no card for the word yet. `suspended` is a card the
        user has shelved out of review (off the queue and off the free card cap).
        `retired` is the terminal tier, done studying, still counted as known.
      enum:
        - none
        - new
        - learning
        - due
        - suspended
        - retired
      example: retired
    Card:
      type: object
      description: One generated card with its own schedule and review revision. Siblings share a note, not progress.
      additionalProperties: false
      required:
        - id
        - revision
        - note
        - template
        - state
        - srsStage
        - deck
      properties:
        revision:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Submit this revision when grading this card.
        id:
          type: integer
          example: 4821
        note:
          type: object
          additionalProperties: false
          required:
            - id
            - title
            - type
            - fields
            - tags
            - driftFlagged
          properties:
            id:
              type: integer
            title:
              type: string
              description: Plain-text label from the mapped expression, first nonempty text field, or note-type name. Not a rendered card face.
            type:
              type: object
              required:
                - id
                - name
                - kind
              properties:
                id:
                  type: integer
                name:
                  type: string
                kind:
                  type: string
                  enum:
                    - standard
                    - cloze
            fields:
              type: array
              description: Ordered source fields, preserving HTML and media references. These values are not rendered card faces.
              items:
                type: object
                additionalProperties: false
                required:
                  - name
                  - value
                properties:
                  name:
                    type: string
                  value:
                    type: string
            tags:
              type: array
              items:
                type: string
            headword:
              type: string
              description: Mapped expression field. Omitted when empty or unmapped; may contain source HTML.
              example: 勉強
            reading:
              type: string
              description: Mapped reading field. Omitted when empty or unmapped; may contain source HTML.
              example: ベンキョウ
            meaning:
              type: string
              description: Mapped meaning field, not the rendered answer. Omitted when empty or unmapped; may contain source HTML.
              example: study; diligence
            driftFlagged:
              type: boolean
              description: Whether the dictionary definition has changed since the note last took it. Shared by every sibling card; not a scheduling signal.
            senses:
              type: array
              description: Dictionary-qualified sense references covered by the note. Omitted for a whole-word note.
              items:
                type: string
              example:
                - jmdict#2
        template:
          type: object
          required:
            - id
            - name
            - ordinal
          properties:
            id:
              type: integer
            name:
              type: string
            ordinal:
              type: integer
              minimum: 0
              description: Zero-based template ordinal within the note type, not the cloze number.
        clozeNumber:
          type: integer
          minimum: 1
          description: The card's one-based cloze number (c1, c3, etc.). Omitted for standard cards.
        state:
          $ref: '#/components/schemas/WordState'
        srsStage:
          type: string
          description: Human-readable schedule stage (New, Apprentice, Proficient, Master, Known, Suspended).
          example: Apprentice
        due:
          type: string
          format: date-time
          description: Next review time. Omitted for new, retired, and suspended cards.
        leech:
          type: boolean
          description: True when the card has lapsed past the leech threshold. Omitted when false.
        deck:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              example: 12
            name:
              type: string
              example: Saved words
    CardResponse:
      type: object
      description: A single SRS card, as the write endpoints echo it back.
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/Card'
    SaveRequest:
      type: object
      additionalProperties: false
      required:
        - lemma
      description: |
        A word to save as a review card. Identity is `(deck, lemma, reading)`, so
        re-saving a word you already have is idempotent. To pin the exact dictionary
        entry (rather than let the server auto-link by lemma+reading), pass the
        portable `(dictionarySlug, sourceId)` handle. This endpoint saves and mines
        only, to grade a due card, use `POST /api/v1/srs/reviews`.
      properties:
        lemma:
          type: string
          description: Dictionary form to save.
          example: 勉強
        reading:
          type: string
          example: ベンキョウ
        surface:
          type: string
          description: Exact inflected form seen by the learner; the card identity remains the dictionary-form lemma.
        meaning:
          type: string
          description: |
            Your own definition, used ONLY when the save has no dictionary entry to
            follow. A linked card composes its meaning from the entry's senses, so a
            value sent here is ignored for one.
        deckId:
          type: integer
          description: Target deck. Defaults to the owner's "Saved words" deck.
        newDeckName:
          type: string
          description: |
            Create a deck with this name and save into it. Wins over `deckId` when both
            are sent, matching the web form, a card can arrive with its own deck
            without a detour through the decks screen.
        hint:
          type: string
          description: A nudge shown on the card's front. Omit to leave an existing card's hint alone; send an empty string to clear it.
        notes:
          type: string
          description: The learner's own note, shown on the answer face. Same omit/clear rule as `hint`.
        dictionarySlug:
          type: string
          description: With `sourceId`, the portable handle to the exact dictionary entry to link. Omit to auto-link by lemma+reading.
        sourceId:
          type: string
          description: The entry's stable in-dictionary id (paired with `dictionarySlug`).
        senses:
          type: array
          description: |
            Which senses this card covers, each `"<dictionary slug>#<that dictionary's
            own 0-based sense number>"` (e.g. `"jmdict#2"`). A bare number would not
            say which book counted it, and a card may cover senses from any dictionary
            the reader has stacked. Omitted for a whole-word card, which covers every
            sense.
          items:
            type: string
          example:
            - jmdict#2
        sentences:
          type: array
          description: |
            Every example this card should carry, in order, a card links a list, and
            the web form's picker is multi-select. Each entry is mined exactly like the
            singular `sentence` below (which is shorthand for a one-element list): the
            owner's sentence bank is reused when the same text is already there, and a
            row may carry its own clip and screenshot. Sending this key REPLACES the
            card's examples; omit it to leave them alone.
          items:
            $ref: '#/components/schemas/SaveSentence'
        sentence:
          $ref: '#/components/schemas/SaveSentence'
        imageDataUrl:
          type: string
          description: |
            Shorthand for the singular `sentence`'s screenshot, the shape the reader
            already posts. Ignored when `sentences[]` is used; put the media on the row.
        audioDataUrl:
          type: string
          description: Shorthand for the singular `sentence`'s clip. Same rule as `imageDataUrl`.
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
        - rating
        - revision
      if:
        properties:
          sessionId: {}
        required:
          - sessionId
      then:
        properties:
          cardId: {}
        required:
          - cardId
      description: |
        Grade one of the caller's cards. Address the card by `cardId`, or by `lemma`
        (+ optional `reading`) to grade the currently-due card for that word, the
        reader's inline-grade path (rejected when the word isn't due).
      properties:
        sessionId:
          type: integer
          minimum: 1
          description: API study session owning this grade. Requires cardId and rejects cards that are not next in its queue. Omit for standalone dictionary reviews.
        revision:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Revision returned with the displayed card. A changed card requires a fresh read before grading.
        cardId:
          type: integer
          description: The card to grade. Provide this or `lemma`.
          example: 4821
        lemma:
          type: string
          description: Grade the currently-due card for this dictionary form, an alternative to `cardId`.
          example: 勉強
        reading:
          type: string
          description: Disambiguating reading for `lemma`.
          example: ベンキョウ
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: 1=Again, 2=Hard, 3=Good, 4=Easy.
          example: 3
    StateRequest:
      type: object
      additionalProperties: false
      required:
        - lemma
        - state
      description: |
        Set a word's learning state. `retired` parks it as learned (out of review);
        `reviewing` brings it into the SRS rotation; `suspended` shelves it (off the
        queue and the free card cap). To pin the exact dictionary entry, pass the
        portable `(dictionarySlug, sourceId)` handle.
      properties:
        lemma:
          type: string
          example: 猫
        state:
          type: string
          description: 'One of: retired, reviewing, suspended.'
          enum:
            - retired
            - reviewing
            - suspended
          example: retired
        reading:
          type: string
        meaning:
          type: string
        deckId:
          type: integer
        dictionarySlug:
          type: string
          description: With `sourceId`, the portable handle to the exact dictionary entry to link.
        sourceId:
          type: string
          description: The entry's stable in-dictionary id (paired with `dictionarySlug`).
    StateLookupRequest:
      type: object
      additionalProperties: false
      description: A batch of words to read state for, in one round-trip.
      required:
        - words
      properties:
        words:
          type: array
          minItems: 1
          maxItems: 500
          description: Dictionary forms, as bare strings or { lemma } objects.
          items:
            oneOf:
              - type: string
                maxLength: 512
              - type: object
                additionalProperties: false
                required:
                  - lemma
                properties:
                  lemma:
                    type: string
                    minLength: 1
                    maxLength: 512
          example:
            - 猫
            - 犬
    StateList:
      type: object
      description: Per-word learning state for a batch lookup.
      required:
        - states
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/WordStateEntry'
    Deck:
      type: object
      description: One of the owner's decks, with its card counts.
      required:
        - id
        - name
        - visibility
        - counts
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Saved words
        visibility:
          type: string
          enum:
            - personal
            - school
        counts:
          type: object
          required:
            - total
            - new
            - due
            - learning
            - review
          description: Card counts; `new` is capped by the deck's new-per-day, like the study UI.
          properties:
            total:
              type: integer
            new:
              type: integer
            due:
              type: integer
            learning:
              type: integer
            review:
              type: integer
    DeckList:
      type: object
      description: The owner's decks.
      required:
        - decks
      properties:
        decks:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
    DeckRequest:
      type: object
      additionalProperties: false
      description: Create or update a deck. On update, only the given fields change.
      properties:
        name:
          type: string
          example: JLPT N3 vocab
        newPerDay:
          type: integer
          description: New cards introduced per day (>= 0).
        desiredRetention:
          type: number
          description: FSRS target retention, between 0.5 and 1.0 (exclusive).
    DeckResponse:
      type: object
      description: A single deck, as the deck write endpoints echo it back.
      required:
        - deck
      properties:
        deck:
          $ref: '#/components/schemas/Deck'
    CardUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: |
        Edit the addressed card's shared note or its individual lifecycle. `meaning`,
        `refresh`, `keepMine`, and `senses` change the note for every sibling card.
        `lifecycle` changes only the addressed card. Imported source fields use the
        note editor; these definition commands apply to dictionary-backed notes.
        Send exactly one command per request.
      properties:
        meaning:
          type: string
          description: |
            Your definition text. Stored as a meaning of your own and marks the note
            user-owned, which stops drift tracking.
        refresh:
          type: boolean
          description: Take the dictionary's current definition and clear the drift flag.
        keepMine:
          type: boolean
          description: Keep your definition and clear the drift flag.
        senses:
          type: array
          description: |
            Which senses this note covers, each `"<dictionary slug>#<that dictionary's
            own 0-based sense number>"` (e.g. `"jmdict#2"`). A bare number would not
            say which book counted it, and a note may cover senses from any dictionary
            the reader has stacked. Send an empty list to cover the whole word; omit
            this property to leave the note's scope unchanged.
          items:
            type: string
          example:
            - jmdict#2
        lifecycle:
          type: string
          description: |
            Move the card through its lifecycle: `suspend` shelves it out of review
            (off the queue and the free card cap), `resume` returns it.
          enum:
            - suspend
            - resume
    WordNote:
      type: object
      description: A personal annotation on a word, separate from a study note and its cards.
      required:
        - id
        - text
        - body
        - updatedAt
      properties:
        id:
          type: integer
          example: 91
        text:
          type: string
          description: The word the note is attached to.
          example: 渋い
        reading:
          type: string
          description: Kana reading. Omitted when the note applies to any reading.
          example: しぶい
        body:
          type: string
          example: My teacher used this for "understated/cool".
        updatedAt:
          type: string
          format: date-time
    WordNoteList:
      type: object
      description: The owner's notes (optionally filtered to one word).
      required:
        - wordNotes
        - pagination
      properties:
        wordNotes:
          type: array
          items:
            $ref: '#/components/schemas/WordNote'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    WordNoteRequest:
      type: object
      additionalProperties: false
      description: Upsert a word annotation, keyed by (text, reading).
      required:
        - text
        - body
      properties:
        text:
          type: string
          example: 渋い
        reading:
          type: string
          example: しぶい
        body:
          type: string
          example: My teacher used this for "understated/cool".
    WordNoteResponse:
      type: object
      description: A single note, as the upsert endpoint echoes it back.
      required:
        - wordNote
      properties:
        wordNote:
          $ref: '#/components/schemas/WordNote'
    CardList:
      type: object
      description: A page of the owner's saved cards.
      required:
        - cards
        - pagination
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    DueQueue:
      type: object
      description: Eligible study cards within daily limits, including linked Anki learning ahead.
      required:
        - cards
        - counts
      properties:
        cards:
          type: array
          description: Up to `limit` cards. Linked Anki cards follow their captured display settings.
          items:
            $ref: '#/components/schemas/Card'
        counts:
          type: object
          required:
            - due
            - new
          description: Totals available (not just this batch).
          properties:
            due:
              type: integer
            new:
              type: integer
    Stats:
      type: object
      description: The owner's study stats, the /api/v1 twin of the website's /stats.
      required:
        - streak
        - longestStreak
        - daysStudied
        - reviewsTotal
        - reviewsDue
        - newAvailable
        - knownWords
        - knownKanji
        - totalCards
        - accuracy7d
        - srsDistribution
      properties:
        streak:
          type: integer
          description: Current consecutive-day study streak.
        longestStreak:
          type: integer
        daysStudied:
          type: integer
          description: Distinct calendar days with a review.
        reviewsTotal:
          type: integer
        reviewsDue:
          type: integer
        newAvailable:
          type: integer
        knownWords:
          type: integer
          description: Mature (FSRS) plus retired cards, the whole knowledge set.,
        knownKanji:
          type: integer
        totalCards:
          type: integer
        accuracy7d:
          type: number
          description: Correct-rate over the last 7 days, as a percentage.
        srsDistribution:
          type: object
          description: Card counts by SRS stage.
          required:
            - New
            - Apprentice
            - Proficient
            - Master
          properties:
            New:
              type: integer
            Apprentice:
              type: integer
            Proficient:
              type: integer
            Master:
              type: integer
    Kanji:
      type: object
      description: A full KANJIDIC character entry.
      required:
        - character
        - levels
        - meanings
        - readings
        - classification
        - lookalikes
      properties:
        character:
          type: string
