                  - note_type_id
                  - revision
                  - definition
                properties:
                  id:
                    type: integer
                    minimum: 1
                  note_type_id:
                    type: integer
                    minimum: 1
                  revision:
                    type: integer
                    minimum: 0
                  definition:
                    type: object
              note:
                type: object
                required:
                  - id
                  - snapshot
                  - note
                properties:
                  id:
                    type: integer
                    minimum: 1
                  snapshot:
                    type: string
                  note:
                    type: object
              cards:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - snapshot
                    - card
                  properties:
                    id:
                      type: integer
                      minimum: 1
                    snapshot:
                      type: string
                    card:
                      type: object
        note_types:
          type: array
          items:
            $ref: '#/components/schemas/result'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/result'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/result'
        history:
          type: array
          items:
            $ref: '#/components/schemas/result'
        cursor:
          type: integer
          minimum: 0
      $defs:
        result:
          type: object
          required:
            - id
            - status
          properties:
            id:
              type:
                - integer
                - 'null'
            status:
