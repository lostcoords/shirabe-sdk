  /api/v1/words/identify:
    post:
      operationId: identifyWords
      summary: Identify which word each parsed token is
      description: |
        Answers which dictionary word each token is, as a ranked list of candidates
        rather than a verdict. This is the call to make when a reader taps a word.

        **This is not `POST /api/v1/search`, and the difference is the point.**
        Search matches a string a PERSON typed: fuzzy, paginated, and with no idea
        what the word was doing in a sentence. These are tokens a MACHINE produced,
        and they carry the two things a spelling cannot tell you: 開いた read
        ヒライタ is ひらく and read アイタ is あく, and きみ read as a pronoun is 君
        rather than the grain the spelling happens to be filed under.

        **A word is ranked, never filtered. Grammar is filtered.** Where a token is a
        particle, an auxiliary or a conjunction, its part of speech is not a hint to
        rank with, it is the identification: `は` comes back as the topic marker
        alone, not with 歯, 葉, 刃 and 派 behind it, all of which its class had
        already ruled out. A content token still offers every word its spelling can
        name, which is where the list earns its length.

        **Nothing has to be stored for this to keep working.** An id is our decision
        about which word a token is, so it moves when we get better at deciding; the
        token does not move. Keep the parse token and ask again whenever a reader
        taps. You will get whatever we know today. Reparse when `stackFingerprint`
        changes if your application needs boundaries from the current dictionary
        stack.

        Batched because a page has many words and a round trip is expensive. Not
        paginated, deliberately: a candidate list is short by nature, and you asked
        about specific tokens rather than browsing.
      tags:
        - Words
      security:
        - BearerAuth:
            - user:dictionary:read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: locale
          in: query
          deprecated: true
          description: Legacy Nadeshiko UI locale; remove when its new SDK reaches production.
          schema:
            type: string
            enum:
              - en
              - es
        - name: dictionaries[]
          in: query
          deprecated: true
          description: Legacy Nadeshiko dictionary selection; remove when its new SDK reaches production.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 128
            items:
              type: string
              minLength: 1
              maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WordIdentifyRequest'
      responses:
        '200':
          description: One answer per requested token, in the order they were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordIdentify'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/words/{id}:
    get:
      operationId: getWord
      summary: Get a word
      description: |
        Returns full detail for one word, addressed by its headword slug
        (`猫`, `私-わたくし`, `開く-ひらく-1202650`). The `word` card merges every
        source in the API key owner's active dictionary stack with complete senses.
        Use `?include=sentences` to add up to 20 preview sentences. Use
        `/api/v1/sentences` when you need filtering or pagination.

        The reading disambiguator may be written in either kana script, so a
        caller holding a morphological analyser's katakana reading looks a word
        up without converting first: `私-ワタクシ` resolves to the same entry as
        `私-わたくし`.

        This answers "show me this selected word". Use `POST /api/v1/identify` to
        determine which word begins at a position in text, or `POST /api/v1/search`
        to search without a known position.
      tags:
        - Words
      security:
        - BearerAuth:
            - user:dictionary:read
      parameters:
        - name: id
          in: path
          required: true
          description: |
            **This is a slug, not a number.** It is the word's own spelling, so
            `願望` and `猫` really are complete, valid ids. If you were expecting
            something numeric you are thinking of `sourceId`, which is the
            dictionary's own record number and a different thing (see below).

            The scheme is `headword`, plus `-<reading>` and `-<sourceId>` only where
            the headword alone would be ambiguous. Nothing is added that is not
            needed to name one word:

            | id | why |
            |----|-----|
            | `猫` | one word is written this way |
            | `私-わたくし` | 私 is also わたし, so the reading names which |
            | `開く-ひらく-1202650` | both readings are common AND ambiguous |

            The reading is accepted in hiragana or katakana (`私-わたくし`,
            `私-ワタクシ`), so a caller holding a morphological analyser's katakana
            output looks a word up without converting first. An exact kana spelling
            wins where a homograph writes the same reading both ways.

            The id is a word handle returned by Search or Identify. Ordinary handles
            may change when dictionary data or disambiguation changes. A handle
            carrying a source id (`開く-ひらく-1202650`) continues to resolve that
            exact dictionary record.
          schema:
            type: string
            minLength: 1
            maxLength: 96
          examples:
            headword:
              summary: Headword only
              value: 猫
            hiraganaReading:
              summary: Disambiguated by reading
              value: 私-わたくし
            katakanaReading:
              summary: Same word, reading as an analyser emits it
              value: 私-ワタクシ
        - name: include
          in: query
          required: false
          description: Comma-separated optional blocks. Currently only `sentences` is supported.
          schema:
            type: string
            enum:
              - sentences
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Word detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordDetail'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/sentences:
    get:
      operationId: listSentences
      summary: Search example sentences
      description: |
        Searches ready official sentence corpora using the website's behavior.
        Japanese words include linked inflections and dictionary forms, Japanese
        phrases match the complete phrase, and non-Japanese text searches selected
        translations. Provide either `query` or `filter[wordId]`.

        Personal sentence banks, mining, and i+1 recommendations belong to Study
        and are not included here.
      tags:
        - Sentences
      parameters:
        - name: query
          in: query
          required: false
          description: Japanese text or translated text. Required unless `filter[wordId]` is present.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              wordId:
                type: string
                maxLength: 512
              translationLanguages:
                type: array
                items:
                  type: string
              sources:
                type: array
                items:
                  type: string
        - name: include
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - tokens
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Matching sentences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentenceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
