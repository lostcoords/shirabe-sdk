          items:
            $ref: '#/components/schemas/SentenceMatch'
        tokens:
          type: array
          description: Present only with `include=tokens`. Offsets use inclusive/exclusive UTF-16 code units.
          items:
            $ref: '#/components/schemas/SentenceToken'
    SentenceSource:
      type: object
