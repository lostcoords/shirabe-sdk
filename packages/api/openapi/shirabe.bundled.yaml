        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
        phase:
          type:
            - string
            - 'null'
        filename:
          type:
            - string
            - 'null'
        progress:
          type:
            - object
            - 'null'
          additionalProperties: false
          required:
            - processed
            - total
            - percent
          properties:
            processed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 1
            percent:
              type: integer
              minimum: 0
              maximum: 100
        dictionary:
          type:
            - object
            - 'null'
          additionalProperties: false
          required:
            - slug
            - name
          properties:
            slug:
              type: string
            name:
              type: string
        error:
          type:
            - object
            - 'null'
          additionalProperties: false
