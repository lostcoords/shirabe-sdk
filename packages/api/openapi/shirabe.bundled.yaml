            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - cursor
                  - changes
                properties:
                  cursor:
                    type: integer
                    minimum: 0
                  changes:
                    type: array
                    maxItems: 500
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/AnkiSyncReceiptPart'
                        - type: object
                          additionalProperties: false
                          required:
                            - cursor
                            - entity_kind
                            - entity_id
                            - operation
                            - payload
                          properties:
                            cursor:
                              type: integer
                              minimum: 1
                            entity_kind:
                              type: string
                              enum:
                                - note_type
                                - note
                                - card
                                - review
                                - media
                                - deck
                            entity_id:
                              type: integer
                              minimum: 1
                            operation:
                              type: string
                              enum:
                                - upsert
                                - delete
                            payload:
                              type: object
