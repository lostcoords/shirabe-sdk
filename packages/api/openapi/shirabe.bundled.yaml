    DictionaryPackManifest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - buildRecipeVersion
        - minimumExtensionVersion
        - contentRevision
        - builtAt
        - artifact
        - compression
        - mediaType
        - bytes
        - sha256
        - counts
        - languages
        - dictionaries
        - modifications
        - sources
        - downloadUrl
        - audio
      properties:
        kind:
          type: string
