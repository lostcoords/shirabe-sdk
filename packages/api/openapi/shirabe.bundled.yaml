                type:
                  - string
                  - 'null'
        sentences:
          type: array
          maxItems: 20
          description: Up to 20 preview sentences, present only with `include=sentences`. Use `/sentences` for filtering and pagination.
          items:
            $ref: '#/components/schemas/Sentence'
    WordCard:
      type: object
      additionalProperties: false
      description: A word card merged from the API key owner's active dictionary stack.
      required:
        - id
        - headword
        - furigana
        - common
        - pitch
        - forms
        - entries
      properties:
        id:
          type: string
          description: Word handle accepted by `GET /api/v1/words/{id}`.
          example: 顔-かお
        headword:
          type: string
          example: 顔
        reading:
          type:
            - string
            - 'null'
          example: かお
        furigana:
          type: array
          description: Reading aligned to the headword. Kana-only runs omit `ruby`.
          items:
            type: object
            additionalProperties: false
            required:
              - text
            properties:
              text:
                type: string
              ruby:
                type: string
        common:
          type: boolean
        jlpt:
          type:
            - string
            - 'null'
          example: N4
        frequency:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Corpus rank, where a lower number is more common.
        pitch:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - downstep
              - pattern
            properties:
              downstep:
                type: integer
                minimum: 0
              pattern:
                type: string
                enum:
                  - heiban
                  - atamadaka
                  - nakadaka
                  - odaka
              audioUrl:
                type:
                  - string
                  - 'null'
                description: Pre-generated recording of this reading and accent, or null when unavailable.
              audioDownloadUrl:
                type: string
                description: Verified published MP3 for offline use. Absent when unavailable.
              autogenerated:
                type: boolean
                description: True when the accent is an automatic estimate rather than a dictionary record.
        forms:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Form'
        entries:
          type: array
          minItems: 1
          description: Dictionary contributions in the owner's source-stack order.
          items:
            $ref: '#/components/schemas/Entry'
    CrossReference:
      type: object
      description: A cross-reference to another entry (related word, antonym, see-also).
      required:
        - text
      properties:
        text:
          type: string
          example: 犬
        reading:
          type:
            - string
            - 'null'
          example: いぬ
        label:
          type: string
          description: Publisher's target-sense marker. Display separately from the text used for lookup.
          example: ①
    CursorPagination:
      type: object
      description: |
        Signed opaque pagination. Echo `cursor` back for the next page without inspecting
        or changing it, using the same operation and filters. Ranked collections tie
        cursors to the data version that produced them. If that data changes, the
        endpoint returns `409 CURSOR_EXPIRED` and the client must restart from the first page.
        Offset-backed collections stop after 10000 results with `400 CURSOR_TOO_DEEP`.
      required:
        - hasMore
        - cursor
      properties:
        hasMore:
          type: boolean
          example: true
        cursor:
          type:
            - string
            - 'null'
          description: |
            Opaque token. Send it in the next request's `cursor` field or query
            parameter, as documented by that operation. Null when there are no more
            pages. Do not reuse it with another operation or another set of filters.
          example: eyJvIjoyMH0
    ErrorBase:
      type: object
      description: |
        RFC 9457 "Problem Details" response body. Switch on `code` for
        programmatic handling; `type`/`title`/`detail` are for humans.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error category.
          example: https://shirabe.org/docs/errors/not-found
        title:
          type: string
          example: Not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: No JMdict entry matches the given writing.
        code:
          type: string
          pattern: ^[A-Z_]+$
          example: NOT_FOUND
        instance:
          type: string
          description: Request ID, useful for support correlation.
          example: req-7f3a9b2c
    Error:
      type: object
      description: |
        RFC 9457 "Problem Details" response body. Switch on `code` for
        programmatic handling; `type`/`title`/`detail` are for humans. Per-status
        schemas (Error400…Error429) narrow `code`/`status` to that status.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          format: uri
          example: https://shirabe.org/docs/errors/not-found
        title:
          type: string
          example: Not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: No KANJIDIC entry for 猫.
        code:
          type: string
          pattern: ^[A-Z_]+$
          example: NOT_FOUND
        instance:
          type: string
          description: Request ID, useful for support correlation.
          example: req-7f3a9b2c
        errors:
          type: object
          additionalProperties:
            type: string
          description: Optional field→message map for validation failures.
    Error400:
      type: object
      description: Bad request / validation failure.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          enum:
            - 400
        detail:
          type: string
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_FAILED
            - DECK_IMPORTING
            - INVALID_CURSOR
            - CURSOR_TOO_DEEP
        instance:
          type: string
        errors:
          description: Field errors keyed by attribute, or schema-validation errors with JSON pointers.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  pointer:
                    type: string
                  parameter:
                    type: string
                  header:
                    type: string
                  cookie:
                    type: string
    Error401:
