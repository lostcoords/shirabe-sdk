    AnkiSyncBatchRequest:
      type: object
      additionalProperties: false
      required:
        - key
        - request_key
      properties:
        key:
          $ref: '#/components/schemas/AnkiSyncKey'
        request_key:
          $ref: '#/components/schemas/AnkiSyncKey'
        creations:
          type: array
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - key
              - delivery_cursor
              - captured_at
              - note
              - cards
            properties:
              key:
                $ref: '#/components/schemas/AnkiSyncKey'
              delivery_cursor:
                type: integer
                minimum: 1
              captured_at:
                type: string
                format: date-time
              owned_type_id:
                type: integer
                minimum: 1
              definition:
                type: object
              note:
                type: object
              cards:
                type: array
                items:
                  type: object
          description: Native creation rows bound to the dispatched request before acknowledgement. A new Shirabe-owned type also returns owned_type_id and its actual native definition. A mismatched receipt rejects the entire batch.
        note_types:
          type: array
          maxItems: 20
          items:
            type: object
        notes:
          type: array
          maxItems: 200
          items:
            type: object
        cards:
          type: array
          maxItems: 200
          items:
            type: object
          description: |
            A source deletion sets deleted to true and sends the last source row,
            the card's base snapshot and its note_base snapshot. Conflicting Shirabe
            edits require reconciliation. An Anki undo sends the restored row with
            the accepted deletion snapshot as its base.
        history:
          type: array
          maxItems: 200
          items:
            type: object
          description: |
            Returned Shirabe review receipts include their original delivery_cursor
            alongside row and sync_id. This distinguishes delivery acknowledgement
            from source-history capture; it cannot restore an archived review.
      description: |
        A durable, atomic batch of source entities. Anki definitions and rows retain
        unknown properties. Domain validation returns per-entity results; the batch
        key cannot be reused for different content. Maximum serialized size is 4 MiB.
    result:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type:
            - integer
            - 'null'
        status:
          type: string
          enum:
            - accepted
            - rejected
            - conflict
        code:
          type: string
        snapshot:
          type: string
        conflict_id:
          type: integer
        revision:
          type: integer
        applied_cursor:
          type: integer
          minimum: 0
          description: Changes through this cursor are included in the accepted card state. Later changes still require delivery. Omitted when the state includes the batch cursor.
        sync_id:
          type:
            - string
            - 'null'
        removed:
          type: boolean
          description: True when a late review receipt is accepted for an archived event without restoring its history or schedule.
        review_undo_cursor:
          type: integer
          minimum: 1
          description: The dispatched Undo request whose event removal and schedule were reconciled by this card result.
        definition:
          type: object
        template_diagnostics:
          type: array
          maxItems: 20
          description: Advisory source checks for this accepted note-type revision. These do not execute scripts or inspect actual note values or media, and do not change acceptance or establish rendering compatibility.
          items:
            type: object
            additionalProperties: false
            required:
              - template
              - side
              - code
              - detail
            properties:
              template:
                type: integer
                minimum: 0
              side:
                type: string
                enum:
                  - question
                  - answer
              code:
                type: string
              detail:
                type: string
                maxLength: 512
        note:
          type: object
        card:
          type: object
        source_deleted:
          type: boolean
          description: True only when the receipt accepts absence from Anki. A card's deleted field alone describes Shirabe trash, including local hiding.
        anki:
          type: object
          required:
            - card_before
            - card_after
            - note_guid
            - anki_type_id
          properties:
            card_before:
              type: object
            card_after:
              type: object
            note_guid:
              type: string
              minLength: 1
            anki_type_id:
              type: integer
              minimum: 1
