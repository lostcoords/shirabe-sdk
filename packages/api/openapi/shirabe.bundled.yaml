              required:
                - key
                - cursor
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                cursor:
                  type: integer
                  minimum: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 200
      responses:
        '200':
          description: Ordered changes. An oversized change is an immutable receipt part; retrieve its remaining bytes using getAnkiDeliveryReceipt before applying or acknowledging the page.
