openapi: 3.1.0
info:
  title: Shirabe API
  version: 0.6.1
  x-logo:
    url: '%LOGO_URL%'
    altText: Shirabe
  description: |
    Public HTTP API for Shirabe. Japanese dictionary lookup over
    JMdict (general vocabulary), JMnedict (proper names), Wikipedia
    (encyclopedic abstracts), and KANJIDIC (per-character data).
    Hand-edited and split per-resource under `paths/` and `components/`.
    Rails validates requests and responses against this file via
    `openapi_first`; Redocly lints + bundles it on every CI run.

    Lookup and analysis use these resources:

    - **`POST /api/v1/search`**: dictionary search using the same tokenizer,
      ranking, filters, and dictionary preferences as the website.
      Returns the preferred query segmentation, with ranked word, name, and
      encyclopedia matches for every segment. Optional expansions add kanji
      details or example sentences to each match.
    - **`POST /api/v1/parse`**: the preferred dictionary-aware segmentation of
      one or more Japanese texts into positioned tokens. Optional enrichments
      add furigana, morphology, or the caller's study state. Synchronous public
      parsing is available without an account.
    - **`POST /api/v1/identify`**: popup lookup from surrounding text and a
      clicked UTF-16 position. It returns overlapping dictionary expressions
      beginning there, with the same ranked word cards as search.

    Text ranges use UTF-16 code-unit offsets so they map directly to JavaScript
    strings and browser text nodes. `startOffset` is inclusive and `endOffset`
    is exclusive.

    - **`POST /api/v1/words/identify`** identifies each supplied parsed token as
      a ranked list of word candidates with definitions.
    - **`GET /api/v1/kanji/{character}`** returns the KANJIDIC character entry
      with sample JMdict compounds.

    Every protected operation accepts an OAuth access token in an
    `Authorization: Bearer …` header. Confidential server integrations obtain
    a short-lived `dictionary:read` token with `client_credentials`; delegated
    applications use authorization-code + PKCE or device authorization and
    request the relevant `user:*` scopes. Existing personal API keys remain a
    legacy bearer credential for their owner, but new integrations should use
    OAuth.

    Rate limits belong to the authenticated credential and refill every minute. Exceed one
    and the server returns `429 Too Many Requests` with
    `code: RATE_LIMIT_EXCEEDED` and a `Retry-After`. A request that is too
    LARGE is a different answer, `413`, which no amount of waiting fixes.
    `GET /api/v1/me` reports both ceilings.

    Error responses follow the RFC 9457 "Problem Details" body shape,
    served as `application/json`. Every error carries `type`, `title`,
    `status`, `detail`, and a stable `code` (UPPER_SNAKE_CASE), switch
    on `code` for programmatic handling. The `instance` field is the
    request ID and is useful for support correlation.

    Requests using an undefined method return `405 METHOD_NOT_ALLOWED`.
    Requests with a body media type that the operation does not accept return
    `415 UNSUPPORTED_MEDIA_TYPE`.

    **Licensing.** The `license` field covers this API and its
    description, not the words it returns. The dictionary content is
    redistributed under its upstream terms: JMdict, JMnedict and
    KANJIDIC2 come from the EDRDG under the EDRDG Licence, which grants
    them under CC BY-SA 4.0, and the other sources carry their own
    licences. Attribution and share-alike travel with the data, so if you
    republish it, republish the notice too. `GET /api/v1/dictionaries` is the
    machine-readable register: it
    returns the name, URL, and licence of the source behind every
    dictionary the register carries. Read `attribution.source` and
    `attribution.license` for structured source and licence details, and
    `attribution.text` when a source only provides free-form attribution.
    [`/credits`](https://shirabe.org/credits) is the human one.
  termsOfService: https://shirabe.org/terms
  contact:
    name: Shirabe
    email: hello@shirabe.org
    url: https://shirabe.org/docs
  license:
    name: Proprietary (Shirabe Terms of Service)
    url: https://shirabe.org/terms
servers:
  - url: https://shirabe.org
    description: Production
  - url: http://localhost:3000
    description: Local development
security:
  - BearerAuth:
      - dictionary:read
tags:
  - name: Search
    description: |
      Dictionary search using the website's core lookup behavior. Entries from
      the caller's dictionaries are merged by canonical form. Website-only
      pages such as sentence, grammar, and people search are separate surfaces.
      Position-based identification for dictionary popups lives here too.
  - name: Words
    description: Full single-word detail.
  - name: MCP
    description: Read-only tools for connecting Shirabe to AI clients.
  - name: Review
    description: Review sessions, grading, undo, due cards, and word-state lookup.
  - name: Cards
    description: Saved cards and their lifecycle, including bulk card updates.
  - name: Decks
    description: Deck management and adding search results to a deck.
  - name: Progress
    description: Study statistics, forecasts, and FSRS settings.
  - name: Notes
    description: Word notes and words excluded from study.
  - name: Anki sync
    description: Two-way synchronization between Shirabe and linked Anki profiles.
  - name: Kanji
    description: |
      Character lookup across KANJIDIC, radicals (部首), and
      component-based discovery.
  - name: Sentences
    description: Example-sentence search (Tatoeba, JMdict examples).
  - name: Tags
    description: The code dictionary that labels POS/misc/field/dialect codes.
  - name: Dictionaries
    description: Dictionary metadata, account ordering, personal imports, and offline artifacts.
  - name: Reader configuration
    description: Public versioned data used by Shirabe Reader; never executable code.
  - name: Account
    description: Authenticated account profile, usage, and quota.
  - name: OAuth
    description: |
      How a connected app gets and keeps access. Shirabe is an OAuth 2.0
      authorization server: register a client, send the user to
      `/oauth/authorize` (authorization code + PKCE) or start the device flow,
      redeem at the token endpoint, renew with the rotating refresh token,
      revoke when the user disconnects. Metadata at
      `/.well-known/oauth-authorization-server` (RFC 8414). Third-party
      clients are registered on request.
paths:
  /api/v1/srs/anki/profiles:
    post:
      operationId: pairAnkiProfile
      summary: Pair a native Anki installation
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - collection_key
                - installation_id
                - key
                - source_metadata
                - media_bytes
              properties:
                collection_key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                installation_id:
                  $ref: '#/components/schemas/AnkiSyncKey'
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                media_bytes:
                  type: integer
                  minimum: 0
                  description: Total saved media bytes in the initial snapshot. Retries must keep this declaration unchanged.
                source_metadata:
                  type: object
                  required:
                    - crt
                    - conf
                    - decks
                  properties:
                    crt:
                      type: integer
                      minimum: 0
                    decks:
                      type: object
                      additionalProperties:
                        type: object
                        required:
                          - id
                          - name
                        properties:
                          id:
                            type: integer
                            minimum: 1
                          name:
                            type: string
                            minLength: 1
                            maxLength: 255
                          dyn:
                            type: integer
                            enum:
                              - 0
                              - 1
                    dconf:
                      type: object
                    conf:
                      type: object
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiSyncProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '413':
          description: Initial media exceeds the remaining account storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMediaQuota'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: unlinkAnkiProfile
      summary: Unlink an Anki profile
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      responses:
        '204':
          description: The profile was unlinked without deleting study data.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/snapshot:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: startAnkiSnapshot
      summary: Start a new Anki snapshot epoch
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - installation_id
                - key
              properties:
                installation_id:
                  $ref: '#/components/schemas/AnkiSyncKey'
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                previous_key:
                  type:
                    - string
                    - 'null'
                  maxLength: 128
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiSyncProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: finishAnkiSnapshot
      summary: Finish an Anki snapshot epoch
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - key
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiSyncProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/collection_settings:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: refreshAnkiCollectionSettings
      summary: Refresh native Anki settings and daily counters
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - key
                - request_key
                - base_revision
                - source_metadata
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                request_key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                base_revision:
                  type: integer
                  minimum: 0
                source_metadata:
                  type: object
                  required:
                    - crt
                    - conf
                    - decks
                    - dconf
                    - capture
                  properties:
                    crt:
                      type: integer
                    conf:
                      type: object
                    decks:
                      type: object
                    dconf:
                      type: object
                    capture:
                      type: object
                      required:
                        - captured_at
                        - days_elapsed
                        - next_day_at
                        - acknowledged_cursor
                      properties:
                        captured_at:
                          type: string
                          format: date-time
                        days_elapsed:
                          type: integer
                        next_day_at:
                          type: integer
                        acknowledged_cursor:
                          type: integer
                          minimum: 0
      responses:
        '200':
          description: Immutable receipt for the accepted settings revision.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_key
                  - revision
                additionalProperties: false
                properties:
                  request_key:
                    $ref: '#/components/schemas/AnkiSyncKey'
                  revision:
                    type: integer
                    minimum: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/publications:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: prepareAnkiPublications
      summary: Prepare a bounded page of Shirabe-owned note changes
      description: Queues unbound notes in selected decks and recomputes bound notes against their published snapshots. Existing creation requests remain unchanged. Retry with the same request_key after a lost response. Continue using the returned after and through until complete, then fetch deliveries. Does not download media.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - key
                - request_key
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                request_key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                after:
                  type: integer
                  minimum: 0
                through:
                  type:
                    - integer
                    - 'null'
                  minimum: 0
      responses:
        '200':
          description: Immutable receipt for this page. Newly created note IDs above through wait until the next preparation pass.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - request_key
                  - after
                  - through
                  - complete
                properties:
                  request_key:
                    type: string
                  after:
                    type: integer
                    minimum: 0
                  through:
                    type: integer
                    minimum: 0
                  complete:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '413':
          description: Media or account storage limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMediaQuota'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/deck_links:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: selectAnkiDeck
      summary: Select a source Anki deck
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - key
                - anki_id
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                anki_id:
                  type: integer
                  minimum: 1
                  maximum: 9223372036854776000
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - anki_id
                  - deck_id
                properties:
                  id:
                    type: integer
                  anki_id:
                    type: integer
                  deck_id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/batches:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: applyAnkiBatch
      summary: Apply a retryable Anki batch
      description: Sync writes require Pro and user:study:write.
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnkiSyncBatchRequest'
      responses:
        '200':
          description: Sync result, or the first byte range of an oversized immutable receipt. Retrieve further ranges using getAnkiBatchReceipt before applying the result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnkiSyncBatchResult'
                  - $ref: '#/components/schemas/AnkiSyncReceiptPart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/batches/{id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getAnkiBatchReceipt
      summary: Read a byte range of an immutable Anki batch receipt
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:read
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A bounded receipt part. A retry returns the same bytes; the next offset is this offset plus the decoded data length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiSyncReceiptPart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/media_files:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listAnkiMediaFiles
      summary: Read a page of a linked profile's private media manifest
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:read
      parameters:
        - name: key
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AnkiSyncKey'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Up to 200 files ordered by ID. Restart a full scan if the revision changes between pages.
          content:
            application/json:
              schema:
                type: object
                required:
                  - files
                  - cursor
                  - revision
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnkiMediaFile'
                  cursor:
                    type: integer
                    minimum: 0
                  revision:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: uploadAnkiMediaFile
      summary: Upload a media file with an immutable retry key and comparison digest
      tags:
        - Anki sync
      security:
        - BearerAuth:
            - user:study:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - key
                - request_key
                - filename
                - digest
                - base
                - file
              properties:
                key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                request_key:
                  $ref: '#/components/schemas/AnkiSyncKey'
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                digest:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                base:
                  type: string
                  pattern: ^([0-9a-f]{64})?$
                  description: Last acknowledged digest, or an empty string for an absent file.
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Immutable upload receipt. A replay returns this result even after a later edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiMediaFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AnkiSyncConflict'
        '413':
          description: Media or account storage limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMediaQuota'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/srs/anki/profiles/{profile_id}/media_files/{id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
