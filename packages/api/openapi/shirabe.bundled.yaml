        newPerDay:
          type: integer
          minimum: 0
        queueOrder:
          type: string
          enum:
            - due_first
            - new_first
            - mixed
        easyDays:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: string
            enum:
              - normal
              - reduced
              - minimum
        timezone:
          type:
            - string
            - 'null'
        dayCutoffHour:
          type: integer
          minimum: 0
          maximum: 23
    DictionarySelection:
      type: array
      minItems: 1
      maxItems: 128
      description: Ordered dictionary slugs for this request. Overrides saved dictionary preferences without changing them. Only dictionaries available to this credential are used; an unavailable selection never falls back to other dictionaries.
      items:
        type: string
        minLength: 1
        maxLength: 128
      example:
        - jmdict
        - jmnedict
    WordIdentifyRequest:
      type: object
      additionalProperties: false
      description: Parsed tokens to identify.
      required:
        - tokens
      properties:
        sentence:
          type: string
          maxLength: 10000
          description: Required with `include=contextualRanking`; the sentence containing the requested token occurrences.
        dictionaries:
          $ref: '#/components/schemas/DictionarySelection'
        include:
          type: array
          description: |
            Fold word-level data onto every candidate, so a client rendering the one
            the reader picked needs no follow-up call. Off by default: a caller that
            only wants to know which words a token could be needs none of it.

            `pitch` adds the accent patterns and their audio, `frequency` the corpus
            rank, `furigana` the reading aligned to the headword, and `jlpt` the level.

            `forms` adds every spelling the word is written with, which is the
            question a reader asks the moment the headword is not the spelling they
            just met (開く is also 空く). `notes` adds the usage notes attached to a
            sense -- "usu. in kana", "after the -te form of a verb" -- and only the
            notes. A sense with no note carries no key.

            `relations` adds `related`, `antonyms`, and `seeAlso` to each sense,
            using the same target text, optional reading, and optional label as
            `GET /api/v1/words/{id}`. These arrays are absent unless requested and
            empty when the sense has no references of that kind. It does not add
            notes, restrictions, or loanword sources; `notes` remains independent.
            `restrictions` and `loanwordSource` stay on `GET /api/v1/words/{id}`.

            `parts` adds the words a multi-word expression is MADE OF. It exists
            because a merged expression resolves to exactly one candidate: 男を知る
            leaves a reader no way to reach 男 or 知る -- not by hovering, since the
            chip spans them, and not through the picker, since the expression is the
            only candidate. Each part carries an `id`, so a client can open it. A
            grammatical expression carries no parts at all (について would otherwise
            offer つく), and neither does a single word.

            This is what makes a popup one round trip instead of two. Without it a
            client has to follow every identify with `GET /api/v1/words/{id}` purely
            to draw a pitch diagram and a badge, and the card visibly rebuilds itself
            when the second answer lands. `GET /api/v1/words/{id}` remains the way to
            get the full detail, including homographs, restrictions, loanword sources,
            and optional sentences, for a word somebody already picked.
          items:
            type: string
            enum:
              - pitch
              - frequency
              - furigana
              - jlpt
              - forms
              - notes
              - relations
              - parts
              - contextualRanking
        tokens:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            The tokens to identify, in the order you want them answered. These are the
            lookup fields derived from a parse token. Send its `lemma`, `surface`, and
            `reading`, and map the parse token's `partOfSpeech` to `pos`.

            A caller with its own tokenizer can skip `/api/v1/parse` entirely and send
            these four fields directly. `pos` has to use our short vocabulary and
            `reading` has to be katakana, or the ranking loses the signal it needs.

            Capped at 200 because the answer carries definitions: measured at roughly
            1 KB per token for a word with two candidates and three senses each, so a
            full batch is a few hundred KB and a page's worth of taps is well inside
            it. Chunk a longer document rather than asking for it in one call.
          items:
            type: object
            additionalProperties: false
            required:
              - lemma
            properties:
              lemma:
                type: string
                maxLength: 128
                description: |
                  The dictionary form the token reduces to, and the only required field. A row without one keeps its slot in the answer as `null`.
                example: 食べる
              surface:
                type: string
                maxLength: 128
                description: The token as it appeared in the text. Defaults to `lemma`.
                example: 食べました
              reading:
                type: string
                maxLength: 128
                description: |
                  The reading of the SURFACE in context, katakana. This is what separates homographs: 開いた read ヒライタ is ひらく, read アイタ is あく, and neither can be told from the spelling alone.
                example: タベマシタ
              pos:
                type: string
                maxLength: 32
                description: |
                  The token's part of speech in our short vocabulary (`noun`, `verb`, `adj`, `adv`, `pron`, `prt`, `aux`, `conj`, `intj`, `det`, `pref`, `suf`, `exp`), NOT a UniDic or JMdict code.

                  It decides where a closed class names exactly one candidate: 君 merely READS きみ, so a spelling-only ranking answers the grain that is filed there, and `pos=pron` is what says otherwise.
                example: verb
              position:
                type: integer
                minimum: 0
                description: Start offset in `sentence`, in UTF-16 code units. Required for contextual ranking and must select `surface` with `length`.
              length:
                type: integer
                minimum: 1
                description: Surface length in UTF-16 code units. Required for contextual ranking and must select `surface` from `sentence`.
    WordIdentify:
      type: object
      description: One answer per requested token, in the order they were sent.
      required:
        - words
      properties:
        stackFingerprint:
          type:
            - string
            - 'null'
          description: |
            Which dictionary stack these answers came out of, digested. The same value
            `GET /api/v1/dictionary-stack` reports under `dictionaryStack.fingerprint`.

            For a client that CACHES lookups. The events that make a cached answer
            untrue all happen here -- the key owner switches off a dictionary,
            reorders their stack, or one is re-imported -- and this is how you find
            out without polling `/api/v1/dictionary-stack` to be told "nothing changed". Compare it
            to the last one you saw; when it moves, your cached answers for this key
            are stale.

            Sound to use as a cache key. It is derived from the stack and the
            dictionary content version, never from anything the caller sends.
          example: 3f2a9c1b4e7d8a05
        words:
          type: array
          description: |
            Index-aligned with `tokens`. `null` wherever nothing resolves, which is
            ordinary for names, numbers, coined words and most symbols, and means
            "show it, do not link it".
          items:
            type:
              - object
              - 'null'
            required:
              - candidates
            properties:
              candidates:
                type: array
                description: |
                  Every word this token's spelling can name, best first.
                  `candidates[0]` is our answer; the rest are what a reader may pick
                  instead.

                  A list rather than one word, because one answer is a claim we often
                  cannot support: きみ can be 君, 黄身 or 黍, and only the reader knows
                  which they meant. We lead with the best reading of the sentence.

                  Ranked, never filtered. A token we read badly costs a word its place
                  in the list, never its place in the dictionary.

                  Link with `id`. STORE `sourceId` and `dictionary`: that pair is an
                  identity and survives a re-import, where the slug is a handle
                  derived from dictionary content and moves when a headword, a
                  commonness flag or one of our resolution rules moves.
                items:
                  type: object
                  required:
                    - id
                    - headword
                  properties:
                    id:
                      type: string
                      description: |
                        Opens the word at `GET /api/v1/words/{id}`. A SLUG, not a
                        number: the word's own spelling, plus `-<reading>` and
                        `-<sourceId>` only where the spelling alone is ambiguous
                        (`猫`, `私-わたくし`, `開く-ひらく-1202650`).

                        Link with this. It is derived from dictionary content, so it
                        moves when a headword, a commonness flag or one of our
                        resolution rules moves. Store `sourceId` and `dictionary`.
                      example: 君-きみ
                    headword:
                      type: string
                      example: 君
                    matchedHeadword:
                      type:
                        - string
                        - 'null'
                      description: |
                        What to CALL this candidate, when its own headword is a kana
                        form the reader never typed. `null` for almost every word.

                        A word "usually written in kana" leads with its own kana, and
                        a word can read more than one way. 彼方 is called かなた and
                        also reads あなた, so a token あなた offers a candidate
                        labelled かなた -- which reads nothing like what was asked
                        about, and says nothing about why it is in the list. Here that
                        candidate carries `彼方`, the spelling both readings share.

                        A LABEL, and nothing else. `id` and `headword` are unaffected,
                        so a stored id still resolves to the same word. Render this
                        where you show the candidate's name; keep using `id` to open
                        it.
                      example: 彼方
                    reading:
                      type:
                        - string
                        - 'null'
                      example: キミ
                    common:
                      type: boolean
                      example: true
                    sourceId:
                      type: string
                      description: The dictionary's own id, stable across re-imports.
                      example: '1247250'
                    dictionary:
                      type: string
                      description: Slug of the dictionary `sourceId` belongs to.
                      example: jmdict
                    furigana:
                      type: array
                      description: |
                        Only with `include=furigana`. The headword's reading aligned to its writing, kanji run by kanji.
                      items:
                        type: object
                        required:
                          - text
                        properties:
                          text:
                            type: string
                          ruby:
                            type:
                              - string
                              - 'null'
                    jlpt:
                      type:
                        - string
                        - 'null'
                      description: Only with `include=jlpt`. e.g. `N5`.
                      example: N5
                    frequency:
                      type:
                        - integer
                        - 'null'
                      description: |
                        Only with `include=frequency`. Corpus rank, lower is commoner.
                      example: 194
                    pitch:
                      type: array
                      description: |
                        Only with `include=pitch`. One entry per accent pattern, with a pre-generated clip where one exists for that (reading, accent).
                      items:
                        type: object
                        required:
                          - downstep
                          - pattern
                        properties:
                          downstep:
                            type: integer
                          pattern:
                            type: string
                          audioUrl:
                            type:
                              - string
                              - 'null'
                          audioDownloadUrl:
                            type: string
                            description: Verified published MP3 copy of this recording for offline use; absent when unavailable.
                          autogenerated:
                            type: boolean
                    forms:
                      type: array
                      description: |
                        Only with `include=forms`. Every spelling this word is written with, kanji and kana alike.
                      items:
                        type: object
                        required:
                          - text
                          - script
                        properties:
                          text:
                            type: string
                            example: 空く
                          script:
                            type: string
                            example: kanji
                          common:
                            type: boolean
                          tags:
                            type: array
                            items:
                              type: object
                              properties:
                                category:
                                  type: string
                                code:
                                  type: string
                                label:
                                  type: string
                    name:
                      type: boolean
                      description: |
                        True when this candidate is a PERSON or a place rather than a
                        word.

                        Published because a client cannot work it out. The obvious test
                        -- `dictionary == "jmnedict"` -- is wrong, and wrong quietly:
                        JMdict carries ~7,300 JMnedict rows under its own slug, so a
                        caller filtering on the slug keeps every one of them and never
                        finds out.

                        Names are ranked, never filtered, here: a token really can be a
                        name, and which of the two a client wants is a question about
                        its corpus rather than about the dictionary.
                      example: false
                    parts:
                      type: array
                      description: |
                        Only with `include=parts`. The words this expression is made
                        of, each with an `id` that opens it.

                        Absent unless the candidate is a multi-word expression whose
                        every component resolves to something the dictionary can open.
                        That gate is why について carries none: its morphemes are
                        grammar, and offering つく would be worse than offering
                        nothing.
                      items:
                        type: object
                        required:
                          - text
                          - lemma
                        properties:
                          text:
                            type: string
                            description: The part as written in the expression.
                            example: 男
                          lemma:
                            type: string
                            description: What it is filed under.
                            example: 男
                          reading:
                            type: string
                            example: オトコ
                          id:
                            type: string
                            description: Opens the part at `GET /api/v1/words/{id}`. Absent when the part resolves to no word, which a client should read as "print it, do not link it".
                            example: 男
                    contextualRanking:
                      type: object
                      description: |
                        Only with `include=contextualRanking`. Ordered sense refs for
                        this occurrence. `contextual=false` means the refs retain
                        canonical order because the provider was unavailable,
                        uncertain, invalid, or failed.
                      required:
                        - refs
                        - contextual
                      properties:
                        refs:
                          type: array
                          items:
                            type: string
                        confidence:
                          type: number
                          minimum: 0
                          maximum: 1
                        contextual:
                          type: boolean
                        reason:
                          type: string
                          enum:
                            - unavailable
                            - invalid
                            - uncertain
                            - limit
                            - failed
                    entries:
                      type: array
                      description: |
                        This candidate's definitions, in the same shape a search result
                        carries them, so one component renders both.

                        They come with the candidates on purpose. A popup showing
                        "君 or きみ?" with no meanings asks the reader to pick blind,
                        and fetching each definition to decide would turn one tap into
                        several round trips.

                        One per dictionary that defines this word in the key owner's
                        stack, in stack order: a
                        reader who put a monolingual dictionary above JMdict gets it
                        first. Each entry names the `dictionary` it came from.

                        A key whose owner has never chosen a stack -- every service
                        identity, and any reader who has not been to their settings --
                        gets exactly one: the entry the candidate is filed under. The
                        default stack is deliberately NOT used to widen this, because
                        it carries dictionaries (wikipedia) nobody asked for.
                      items:
                        $ref: '#/components/schemas/Entry'
    dictionaryStack:
      type: object
      additionalProperties: false
      required:
        - fingerprint
        - sources
      properties:
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{16}$
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryStackSource'
    Error503:
      type: object
      description: A dictionary operation is temporarily unavailable.
      required:
        - type
        - title
        - status
        - code
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          enum:
            - 503
        detail:
          type: string
        code:
          type: string
          enum:
            - DICTIONARY_PACK_UNAVAILABLE
        instance:
          type: string
    ReaderHostRules:
      type: object
      additionalProperties: false
      required:
        - version
        - rules
      properties:
        version:
          type: integer
          minimum: 1
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - host
            properties:
              host:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              mode:
                type: string
                enum:
                  - auto
                  - 'off'
              parse:
                type: string
              filter:
                type: string
              allFrames:
                type: boolean
              collapseWhitespace:
                type: boolean
              custom:
                type: string
                enum:
                  - youtube
                  - netflix
                  - mokuro
    TokenComponent:
      type: object
      description: A conservative Sudachi B-mode lexical word inside a lookup chip.
      required:
        - surface
        - pos
        - role
        - offset
        - length
      properties:
        surface:
          type: string
          description: Component surface form as it appeared inside the chip.
        lemma:
          type:
            - string
            - 'null'
          description: Independently searchable dictionary form.
        reading:
          type:
            - string
            - 'null'
          description: Katakana reading of the component surface.
        pos:
          type: array
          items:
            type: string
          description: Full Sudachi POS chain.
        role:
          type: string
          enum:
            - word
            - numeric
            - counter
        offset:
          type: integer
          minimum: 0
          description: UTF-16 offset relative to the start of the outer chip.
        length:
          type: integer
          minimum: 1
          description: Component length in UTF-16 code units.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Signed pagination cursor returned by a previous response. Treat it as opaque: pass
        back exactly what `pagination.cursor` gave you with the same operation and
        filters. Some ranked collections expire cursors when their data changes;
        `409 CURSOR_EXPIRED` means to restart from the first page. A malformed or
        cross-operation cursor returns `400 INVALID_CURSOR`. Offset-backed collections
        stop after 10000 results and return `400 CURSOR_TOO_DEEP`.
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Preferred language for Shirabe-owned labels. Regional tags and weighted
        language lists are accepted; unsupported languages fall back to English.
        Dictionary definition languages are selected separately by each operation.
      schema:
        type: string
        example: es-ES, en;q=0.8
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique retry key, scoped to this credential and operation for 24 hours.
        Repeating the same request returns the original response without applying it
        again. Reusing the key with another body returns `409`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
          example:
            type: https://shirabe.org/docs/errors/not-found
            title: Not found
            status: 404
            detail: No entry matches the given query.
            code: NOT_FOUND
            instance: req-7f3a9b2c
    BadRequest:
      description: Malformed request or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
          examples:
            BadRequest:
              summary: Missing required parameter
              value:
                type: https://shirabe.org/docs/errors/bad-request
                title: Bad request
                status: 400
                detail: Parameter 'q' is required.
                code: BAD_REQUEST
                instance: req-7f3a9b2c
            ValidationFailed:
              summary: Request failed schema validation
              value:
                type: https://shirabe.org/docs/errors/validation-failed
                title: Validation failed
                status: 400
                detail: The request did not match the API schema.
                code: VALIDATION_FAILED
                instance: req-7f3a9b2c
            CursorTooDeep:
              summary: Cursor past the paging ceiling
              value:
                type: https://shirabe.org/docs/errors/bad-request
                title: Bad request
                status: 400
                detail: Paging stops at 10000 results. Narrow the query rather than paging deeper.
                code: CURSOR_TOO_DEEP
                instance: req-7f3a9b2c
            InvalidCursor:
              summary: Cursor could not be verified
              value:
                type: https://shirabe.org/docs/errors/invalid-cursor
                title: Invalid cursor
                status: 400
                detail: Use the cursor returned by the previous page unchanged.
                code: INVALID_CURSOR
                instance: req-7f3a9b2c
    MethodNotAllowed:
      description: The path does not support this request method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error405'
    UnsupportedMediaType:
      description: The request body uses an unsupported media type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error415'
    OauthError:
      description: The request could not be granted (RFC 6749 §5.2 vocabulary).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOauth'
          examples:
            InvalidGrant:
              summary: Code, refresh token or device code refused
              value:
                type: https://shirabe.org/docs/errors/invalid-grant
                title: Invalid grant
                status: 400
                detail: Refresh token expired, revoked, or already used.
                code: INVALID_GRANT
                error: invalid_grant
                error_description: Refresh token expired, revoked, or already used.
                instance: req-7f3a9b2c
            AuthorizationPending:
              summary: Device flow, user has not approved yet
              value:
                type: https://shirabe.org/docs/errors/authorization-pending
                title: Authorization pending
                status: 400
                detail: The user has not approved yet.
                code: AUTHORIZATION_PENDING
                error: authorization_pending
                error_description: The user has not approved yet.
                instance: req-7f3a9b2c
    OauthInvalidClient:
      description: Unknown client, or a confidential client that did not prove itself.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOauth'
          examples:
            InvalidClient:
              value:
                type: https://shirabe.org/docs/errors/invalid-client
                title: Invalid client
                status: 401
                detail: Unknown client, or the client secret does not match.
                code: INVALID_CLIENT
                error: invalid_client
                error_description: Unknown client, or the client secret does not match.
                instance: req-7f3a9b2c
    PaymentRequired:
      description: This action requires Pro, the SRS is the paid product (docs/srs.md §10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error402'
          example:
            type: https://shirabe.org/docs/errors/pro-required
            title: Pro required
            status: 402
            detail: Saving cards for review requires Pro.
            code: PRO_REQUIRED
            instance: req-7f3a9b2c
    Unauthorized:
      description: |
        Missing, invalid, expired, or revoked bearer token. Carries a
        `WWW-Authenticate: Bearer` challenge (RFC 6750); an OAuth client that reads
        `error="invalid_token"` should renew with its refresh token and retry once.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          examples:
            TokenRequired:
              summary: No bearer token supplied
              value:
                type: https://shirabe.org/docs/errors/token-required
                title: Bearer token required.
                status: 401
                detail: Send an API key or OAuth access token as the Authorization bearer token.
                code: TOKEN_REQUIRED
                instance: req-7f3a9b2c
            InvalidToken:
              summary: Token invalid, expired, or revoked
              value:
                type: https://shirabe.org/docs/errors/invalid-token
                title: Invalid token.
                status: 401
                detail: The API key or access token is invalid, expired, or revoked.
                code: INVALID_TOKEN
                instance: req-7f3a9b2c
    Forbidden:
      description: The API key lacks a scope required for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
          example:
            type: https://shirabe.org/docs/errors/insufficient-scope
            title: Insufficient scope
            status: 403
            detail: This API key is missing the user:profile:read scope.
            code: INSUFFICIENT_SCOPE
            instance: req-7f3a9b2c
    RateLimited:
      description: |
        Too many requests; back off and retry after `Retry-After` seconds.

        There is one kind of 429 now. It comes from in front of the application, which
        is why the answer is a wait and nothing else: the budget it names refills on a
        fixed 60-second window, so retrying after the header says is enough. There is
        no monthly quota and no `RateLimit-*` fields to read.

        A request that is too LARGE is not this: that answers 413 with no
        `Retry-After`, because waiting cannot make it acceptable. `GET /api/v1/me` reports
        both ceilings, under `rateLimit` and `payloadLimit`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
          examples:
            RateLimitExceeded:
              summary: Per-minute request budget for this API key
              value:
                type: https://shirabe.org/docs/errors/rate-limit-exceeded
                title: Too many requests
                status: 429
                detail: 60 requests/minute for this API key. Try again shortly.
                code: RATE_LIMIT_EXCEEDED
                instance: req-7f3a9b2c
            TokenizationRateLimitExceeded:
              summary: Per-minute character budget for parsing
              value:
                type: https://shirabe.org/docs/errors/rate-limit-exceeded
                title: Too many requests
                status: 429
                detail: 100000 tokenization characters/minute for this user. Try again shortly.
                code: RATE_LIMIT_EXCEEDED
                instance: req-7f3a9b2c
    AnkiSyncConflict:
      description: The sync epoch, collection identity or idempotency key conflicts with stored state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
    NotModified:
      description: |
        The copy you already hold is still current, so there is no body. Sent when the
        request carries `If-None-Match` and the `ETag` still matches.

        Dictionary reads are cached `private` with a short `max-age` and an `ETag`
        covering everything the answer depends on: the imported dictionary content, the
        rules that decide which word a token is, and the key's own dictionary stack. A
        client that stores the `ETag` and sends it back turns a repeated lookup into
        this, which is the difference that matters when a reader hovers the same word
        again. It is `private` because the body differs per key, so a shared cache must
        never hold it.
      headers:
        ETag:
          description: The version of the copy you hold. Send it back as `If-None-Match`.
          schema:
            type: string
        Cache-Control:
          description: Always `private`, with the `max-age` a client may reuse without asking.
          schema:
            type: string
    ServiceUnavailable:
      description: The requested generated artifact is not currently available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error503'
  securitySchemes:
    McpOAuth:
      type: oauth2
      description: Optional OAuth access token for account dictionary preferences. Personal API keys are refused.
      flows:
        authorizationCode:
          authorizationUrl: https://shirabe.org/oauth/authorize
          tokenUrl: https://shirabe.org/api/v1/oauth/token
          scopes:
            user:dictionary:read: Read dictionary entries and parse Japanese text.
            user:profile:read: Read the account profile.
            user:preferences:read: Read account preferences and the dictionary stack.
            user:preferences:write: Update account preferences.
            user:dictionaries:read: Read personal dictionaries.
            user:dictionaries:write: Manage personal dictionaries.
            user:study:read: Read study data.
            user:study:write: Change study data.
        clientCredentials:
          tokenUrl: https://shirabe.org/api/v1/oauth/token
          scopes:
            dictionary:read: Read shared dictionary entries and parse Japanese text.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        An OAuth access token (`shra_…`) obtained at `/api/v1/oauth/token`.
        Confidential services use `client_credentials`; user-facing clients use
        authorization-code + PKCE or device authorization. A personal API key
        (`shr_…`) is accepted only as a legacy bearer credential for its owner;
        do not provision it for new services. A missing or bad bearer answers
        401 with a `WWW-Authenticate: Bearer` challenge (RFC 6750).
  headers:
    RetryAfter:
      description: |
        Seconds to wait before retrying. On `RATE_LIMIT_EXCEEDED` it is the rest of
        the current minute, so read
        it before scheduling a retry rather than assuming a short wait.
      schema:
        type: integer
        minimum: 1
        example: 60
x-tagGroups:
  - name: Lookup
    tags:
      - Search
      - Words
      - Kanji
      - Sentences
  - name: Study
    tags:
      - Review
      - Cards
      - Decks
      - Progress
      - Notes
      - Anki sync
  - name: User
    tags:
      - Account
      - OAuth
  - name: Dictionary data
    tags:
      - Dictionaries
      - Tags
      - Reader configuration
  - name: Integrations
    tags:
      - MCP
